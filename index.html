function dotByMins(mins){ if(mins==null)return ''; const c=mins<30?'g':(mins<=60?'a':'r'); return `<span class="tdot ${c}"></span>`; }
function mesaCard(m){
  const libre=m.est==='libre';
  const key=m.grp||('mesa_'+m.n);
  const ometa=ORDMETA[key]||{};
  const mins=(!libre&&ometa.openedAt)?Math.max(0,Math.floor((Date.now()-ometa.openedAt)/60000)):null;
  const fase=ometa.fase;
  const timeStr=libre?'Disponible':(fase==='facturada'?'Facturada · falta pago':(fase==='precuenta'?'Pidió la cuenta':(m.est==='cobr'?'Por cobrar':(mins!=null?('hace '+mins+' min'):(m.t||'ahora')))));
  const mesero=ometa.mesero||m.mesero;
  const koc=mesaKitchen(m);
  const K={sinpedir:['⏳','Sin enviar','k-wait'],parcial:['➕','Por enviar','k-wait'],cocina:['🍳','En cocina','k-cook'],listo:['✅','Listo p/ servir','k-ready'],servido:['🍽️','Servido','k-served']};
  const com=(ometa.com)||m.com||2;
  const nit=(ORD[key]||[]).reduce((s,l)=>s+l.qty,0);
  const badges=[];
  if(!libre){
    if(fase==='facturada') badges.push(`<span class="mb alert cuenta">💵 Facturada · falta pago</span>`);
    else if(fase==='precuenta') badges.push(`<span class="mb alert cuenta">🧾 Pidió la cuenta</span>`);
    else if(m.alerta) badges.push(`<span class="mb alert ${m.alerta}">${m.alerta==='mesero'?'🔔 Llamó':'🧾 Pidió cuenta'}</span>`);
    badges.push(`<span class="mb com">👥 ${com}</span>`);
    if(nit) badges.push(`<span class="mb">🍽️ ${nit}</span>`);
    if(!fase && koc&&K[koc]) badges.push(`<span class="mb ${K[koc][2]}">${K[koc][0]} ${K[koc][1]}</span>`);
  }
  return `<div class="mesa ${m.est}${unirSel.includes(m.n)?' sel':''}" onclick="clickMesa(${m.n},'${m.est}')">

    ${badges.length?`<div class="mesa-badges">${badges.join('')}</div>`:''}
    ${m.m?`<div class="mesa-m">${COP(m.m)}</div>`:''}</div>`;
}

function confirmarUnir(){
  if(unirSel.length<2){toastT('Selecciona al menos 2 mesas');return;}
  if(typeof _exigirCaja==='function' && !_exigirCaja()){ return; }   // BLOQUEA: sin caja abierta no se unen mesas ni se abre comanda
  const nums=unirSel.slice().sort((a,b)=>a-b);
  const key='mesa_'+nums.join('_');
  const title='Mesa '+nums.map(pad).join(' + ');
  nums.forEach(n=>{const m=getMesa(n);m.est='ocup';m.t='unida';m.merged=true;m.grp=key;m.grpLabel=title;});
  unirMode=false;unirSel=[];
  openOrder(key,title,'🔗',{com:nums.length*2});
}
function clickMesa(n,est){
  if(unirMode){ if(est==='libre'){const i=unirSel.indexOf(n);i>-1?unirSel.splice(i,1):unirSel.push(n);renderComContent();} else {toastT('Solo puedes unir mesas disponibles');} return; }
  const m=getMesa(n);
  if(est==='libre'){askComensales(n);}
  else if(m&&m.grp){openOrder(m.grp,m.grpLabel||('Mesa '+pad(n)),'🔗');}
  else {openOrder('mesa_'+n,'Mesa '+pad(n),'🍽️');}
}
function newOrder(type){
  if(typeof _exigirCaja==='function' && !_exigirCaja()){ return; }   // BLOQUEA: sin caja abierta no hay pedido
  if(type==='delivery'){askAddress();return;}
  const map={llevar:['🥡','Para llevar'],dext:['🛴','Rappi/PYA'],online:['🌐','Online']};
  const id=type+'_'+(ordSeq++);
  openOrder(id, map[type][1]+' #'+id.split('_')[1], map[type][0]);
}

/* comensales modal */
function askComensales(n){
  if(typeof _exigirCaja==='function' && !_exigirCaja()){ return; }   // BLOQUEA: sin caja abierta no hay pedido
  pendingMesa=n;comensales=1;
  const m=document.getElementById('comModal');
  m.innerHTML=`<div class="modal" style="width:340px">
    <div class="modal-h"><b>Iniciar comanda · Mesa ${pad(n)}</b><div class="mx" onclick="closeCom()">✕</div></div>
    <div class="modal-b"><div style="font-size:13px;color:var(--txt2);margin-bottom:14px;text-align:center">Nº de comensales en la mesa</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:22px">
        <div class="qb" style="width:40px;height:40px;font-size:20px" onclick="setCom(-1)">−</div>
        <span id="comN" style="font-family:'Outfit',sans-serif;font-size:34px;font-weight:700;min-width:44px;text-align:center">1</span>
        <div class="qb" style="width:40px;height:40px;font-size:20px" onclick="setCom(1)">+</div>
      </div></div>
    <div class="modal-f"><button class="btn primary" onclick="startMesa()">🍽️ Iniciar comanda</button></div></div>`;
  m.classList.add('on');
}
function setCom(d){comensales=Math.max(1,comensales+d);document.getElementById('comN').textContent=comensales;}
function closeCom(){document.getElementById('comModal').classList.remove('on');}
function startMesa(){const n=pendingMesa;closeCom();openOrder('mesa_'+n,'Mesa '+pad(n),'🍽️',{com:comensales});}
document.getElementById('comModal').addEventListener('click',e=>{if(e.target.id==='comModal')closeCom();});

/* delivery address modal */
function askAddress(){
  const m=document.getElementById('comModal');
  m.innerHTML=`<div class="modal" style="width:400px">
    <div class="modal-h"><b>🛵 Nuevo domicilio</b><div class="mx" onclick="closeCom()">✕</div></div>
    <div class="modal-b">
      <div style="font-size:12px;color:var(--txt2);margin-bottom:6px">Nombre del cliente</div>
      <input id="addrName" placeholder="Nombre" style="width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--txt);font-family:inherit;font-size:14px;outline:none;margin-bottom:12px">
      <div style="font-size:12px;color:var(--txt2);margin-bottom:6px">Dirección de entrega</div>
      <input id="addrInput" placeholder="Cra 5 # 10-20, Barrio Centro" style="width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--txt);font-family:inherit;font-size:14px;outline:none;margin-bottom:12px">
      <div style="font-size:12px;color:var(--txt2);margin-bottom:6px">Teléfono / WhatsApp</div>
      <input id="addrPhone" inputmode="numeric" placeholder="300 123 4567" style="width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--txt);font-family:inherit;font-size:14px;outline:none">
    </div>
    <div class="modal-f"><button class="btn primary" onclick="startDelivery()">Crear domicilio</button></div></div>`;
  m.classList.add('on');
}
function startDelivery(){
  const addr=(document.getElementById('addrInput').value||'').trim();
  const phone=(document.getElementById('addrPhone').value||'').trim();
  const name=(document.getElementById('addrName').value||'').trim();
  if(!addr){ toastT('📍 Escribe la dirección de entrega'); const e=document.getElementById('addrInput'); if(e)e.focus(); return; }   // domicilio sin dirección no sirve
  closeCom();
  const id='delivery_'+(ordSeq++);
  openOrder(id,'Domicilio #'+id.split('_')[1],'🛵',{address:addr,phone,cliente:name});
}

/* order taking per target */
function openOrder(target,title,ico,meta){
  // ¿La comanda YA existe? (creada aquí o traída de la nube por otro mesero)
  // Nos guiamos por ORDMETA, NO por si ORD tiene líneas: una mesa recién iniciada
  // puede tener 0 productos y aun así ya tiene dueño (mesero). Así NUNCA se re-estampa
  // el mesero actual encima del mesero que realmente abrió la mesa. (responsabilidad + propinas)
  const yaExiste = !!ORDMETA[target];
  if(!yaExiste){
    ORD[target]=ORD[target]||[];ORDCAT[target]='Recomendados';
    ORDMETA[target]=Object.assign({com:4,mesero:_meseroActual(),almacen:'Almacén principal',cliente:'',obs:'',num:'22600'+String(1000+(ordNumSeq++))+'-1',openedAt:Date.now(),title,ico},meta||{});
  } else {
    if(!ORD[target])ORD[target]=[];
    if(ORDCAT[target]==null)ORDCAT[target]='Recomendados';
    if(meta){ const _mesDueno=ORDMETA[target].mesero; ORDMETA[target]=Object.assign({},ORDMETA[target],meta); if(_mesDueno)ORDMETA[target].mesero=_mesDueno; }
  }
  const mt=ORDMETA[target]; if(mt){ if(!mt.title)mt.title=title; if(!mt.ico)mt.ico=ico; if(!mt.openedAt)mt.openedAt=Date.now(); }
  DYN[target]={title:(mt&&mt.title)||title,ico:(mt&&mt.ico)||ico,render:()=>orderView(target),init:()=>initOrder(target)};
  openTab(target);
}
function reopenOrder(k){const mt=ORDMETA[k]||{};openOrder(k,mt.title||k,mt.ico||'🧾');}
function orderView(target){
  const meta=ORDMETA[target]||{}; const isMesa=target.startsWith('mesa_');
  const mesaObj=isMesa?getMesa(+target.replace('mesa_','').split('_')[0]):null;
  let ctx='Pedido sin mesa';
  if(isMesa) ctx=(mesaObj?mesaObj.piso+' · ':'')+'Comensales: '+(meta.com||4);
  else if(meta.address) ctx='📍 '+meta.address+(meta.phone?(' · '+meta.phone):'');
  return `
  <div class="page-head"><h1>${DYN[target].ico} ${DYN[target].title} <span class="status-pill activo">Comanda abierta</span></h1>
    <div class="sub">${ctx} · Orden ${meta.num||''}</div></div>
  <div class="tp">
    <div class="tp-left">
      <div class="tp-toolbar">
        <div class="tp-search2">🔎<input id="search_${target}" placeholder="Ingrese el nombre del producto y presione Enter…" oninput="renderProds('${target}')" onkeydown="searchEnter('${target}',event)"></div>
        <div class="view-toggle">
          <button id="vg_${target}" class="${viewMode==='grid'?'on':''}" onclick="setView('${target}','grid')" title="Vista foto">▦</button>
          <button id="vl_${target}" class="${viewMode==='list'?'on':''}" onclick="setView('${target}','list')" title="Vista lista">☰</button>
        </div>
      </div>
      <div class="chips" id="chips_${target}"></div>
      <div id="prods_${target}"></div>
    </div>
    <div class="comanda">
      <div class="comanda-h"><b>🧾 Comanda</b>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="ver-mesas" title="Ver pedido en pantalla completa" onclick="openFull('${target}')">⛶ Ampliar</button>
          <button class="ver-mesas" onclick="openTab('mesas')">🍴 Ver mesas</button>
          <span class="cnt" id="ccount_${target}">0 ítems</span>
        </div></div>
      <div class="comanda-meta" id="cmeta_${target}"></div>
      <div class="comanda-scroll">
        <div class="comanda-body" id="cbody_${target}"></div>
        <div class="comanda-f" id="cfoot_${target}"></div>
      </div>
    </div>
  </div>`;
}
function renderMeta(target){
  const el=document.getElementById('cmeta_'+target); if(!el)return;
  const meta=ORDMETA[target]||{}; const isMesa=target.startsWith('mesa_');
  let html=`<div class="cm-field">🏬 <select onchange="setAlmacen('${target}',this.value)">${ALMACENES.map(a=>`<option ${a===meta.almacen?'selected':''}>${a}</option>`).join('')}</select></div>
    <div class="cm-field">👤 <select onchange="setMesero('${target}',this.value)">${(function(){var ns=_meserosLista();if(meta.mesero&&ns.indexOf(meta.mesero)<0)ns=[meta.mesero].concat(ns);return ns.map(x=>`<option ${x===meta.mesero?'selected':''}>${x}</option>`).join('');})()}</select></div>`;
  if(isMesa){
    html+=`<div class="cm-com">👥 Comensales <div class="qb" onclick="chgComensales('${target}',-1)">−</div><b id="cmn_${target}">${meta.com||1}</b><div class="qb" onclick="chgComensales('${target}',1)">+</div></div>`;
  } else if(meta.phone){
    html+=`<div class="cm-field">📞 ${meta.phone}</div>`;
  }
  el.innerHTML=html;
}
function initOrder(target){
  document.getElementById('chips_'+target).innerHTML=CATS.map(c=>`<div class="chip${c===ORDCAT[target]?' active':''}" onclick="setCat('${_q(target)}','${_q(c)}')">${c}</div>`).join('');
  renderMeta(target);renderProds(target);renderComanda(target);
}
function renderFields(target){
  const el=document.getElementById('cfld_'+target);if(!el)return;const meta=ORDMETA[target]||{};
  el.innerHTML=`<div class="cf-in"><span class="lb">👤</span><input placeholder="Nombre del cliente (opcional)" value="${(meta.cliente||'').replace(/"/g,'&quot;')}" onchange="setCliente('${target}',this.value)"></div>
    <div class="cf-in"><span class="lb">📝</span><input placeholder="Nota para toda la comanda (ej: alérgico al maní)" value="${(meta.obs||'').replace(/"/g,'&quot;')}" onchange="setObs('${target}',this.value)"></div>`;
}
function setView(target,mode){viewMode=mode;
  const g=document.getElementById('vg_'+target),l=document.getElementById('vl_'+target);
  if(g)g.classList.toggle('on',mode==='grid'); if(l)l.classList.toggle('on',mode==='list');
  renderProds(target);
}
function setCat(target,c){ORDCAT[target]=c;document.querySelectorAll('#chips_'+target+' .chip').forEach(x=>x.classList.toggle('active',x.textContent===c));renderProds(target);}
function prodList(target){
  const q=norm(document.getElementById('search_'+target)?.value||'');
  const cat=ORDCAT[target];
  return PRODUCTS.filter(p=>{
    if(p.activo===false||p.enPanel===false)return false;
    const inCat=cat==='Recomendados'?p.rec:p.cat===cat;
    return q?norm(p.n).includes(q):inCat;});
}
function renderProds(target){
  const cont=document.getElementById('prods_'+target); if(!cont)return;
  const list=prodList(target);
  if(!list.length){cont.className='prod-grid';cont.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="ee">🔍</div>Sin resultados</div>`;return;}
  if(viewMode==='list'){
    cont.className='prod-list';
    cont.innerHTML=list.map(p=>`<div class="prow" onclick="pick('${target}','${p.id}')">
      ${p.img?`<span class="pe2 pe2-img" style="background-image:url(${p.img})"></span>`:`<span class="pe2">${p.e||'🍽️'}</span>`}<span class="pn2">${p.n}</span>${p.opts?'<span class="popt2">opciones</span>':''}<span class="pp2">${COP(p.pr)}</span><span class="padd2">+</span></div>`).join('');
  } else {
    cont.className='prod-grid';
    cont.innerHTML=list.map(p=>`<div class="prod" onclick="pick('${target}','${p.id}')">${p.opts?'<span class="popt">opciones</span>':''}
      ${p.img?`<div class="pe pe-img" style="background-image:url(${p.img})"></div>`:`<div class="pe">${p.e||'🍽️'}</div>`}<div class="pn">${p.n}</div><div class="pp">${COP(p.pr)}</div><div class="padd">+</div></div>`).join('');
  }
}
function searchEnter(target,e){
  if(e.key!=='Enter')return;
  const list=prodList(target);
  if(list.length){ pick(target,list[0].id); const inp=document.getElementById('search_'+target); if(inp)inp.value=''; renderProds(target); }
  else toastT('No se encontró el producto');
}
function pick(target,id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;if(p.opts&&p.opts.length){openOpts(target,p);}else{addLine(target,p,[]);}}
function addLine(target,p,sel){
  const extra=sel.reduce((s,o)=>s+o.p,0);
  ORD[target].push({lid:LID++,id:p.id,n:p.n,qty:1,opts:sel,unit:p.pr+extra,sent:false,held:false,cort:false,llevar:false,desc:0,area:p.area||'COCINA',notes:[[]]});
  renderComanda(target);syncMesa(target);toastT('Se agregó '+p.n+' a la comanda');
}
function changeQty(target,lid,d){
  const l=ORD[target].find(x=>x.lid===lid);
  if(l&&!l.sent){
    l.qty=Math.max(1,l.qty+d);
    while(l.notes.length<l.qty)l.notes.push([]);
    while(l.notes.length>l.qty)l.notes.pop();
    renderComanda(target);syncMesa(target);
  }
}
function delLine(target,lid){
  const l=ORD[target].find(x=>x.lid===lid); if(!l)return;
  if(l.sent){
    const mot=prompt('Este plato ya fue enviado a cocina.\n¿Por qué se anula "'+l.n+'"? (ej: el cliente ya no lo quiere, demora, error):');
    if(!mot)return;
    const meta=ORDMETA[target]||{};
    if(typeof addAnulacion==='function') addAnulacion({ ts:Date.now(), tipo:'producto', mesa:target, origen:(DYN[target]&&DYN[target].title)||target, mesero:meta.mesero||(typeof _meseroActual==='function'?_meseroActual():''), producto:l.n, qty:l.qty, unit:l.unit, monto:l.unit*l.qty, motivo:mot });
    toastT('🚫 Anulado: '+l.n+' — '+mot);
  }
  ORD[target]=ORD[target].filter(x=>x.lid!==lid);
  renderComanda(target);syncMesa(target);
  if(typeof pushComandasSoon==='function')pushComandasSoon(true);
  if(document.getElementById('kdsBoard')){ if(typeof renderKds==='function')renderKds(); if(typeof renderKdsAreas==='function')renderKdsAreas(); }
}
function toggleHold(target,lid){const l=ORD[target].find(x=>x.lid===lid);if(l&&!l.sent){l.held=!l.held;renderComanda(target);}}
function toggleCort(target,lid){const l=ORD[target].find(x=>x.lid===lid);if(l){l.cort=!l.cort;toastT(l.cort?'🎁 Cortesía: '+l.n:'Cortesía quitada');renderComanda(target);syncMesa(target);}}
function toggleLlevar(target,lid){const l=ORD[target].find(x=>x.lid===lid);if(l){l.llevar=!l.llevar;toastT(l.llevar?'🥡 Para llevar: '+l.n:'Ya no es para llevar');renderComanda(target);}}
function changePrice(target,lid,v){const l=ORD[target].find(x=>x.lid===lid);if(!l)return;const n=parseInt((v+'').replace(/\D/g,''))||0;l.unit=n;renderComanda(target);syncMesa(target);}
function setPos(target,lid,v){
  const lines=ORD[target];const from=lines.findIndex(x=>x.lid===lid);const to=Math.max(0,Math.min(lines.length-1,(+v)-1));
  if(from<0||from===to)return;lines.splice(to,0,lines.splice(from,1)[0]);renderComanda(target);
}
function noteStr(l){
  return l.notes.map((arr,i)=>arr.length?((l.qty>1?('U'+(i+1)+': '):'')+arr.join(', ')):'').filter(Boolean).join('   ·   ');
}
function lineNet(l){return l.cort?0:Math.max(0,l.unit*l.qty-(l.desc||0));}
function netTotal(lines){return (lines||[]).reduce((s,l)=>s+lineNet(l),0);}
let pendingEditLid=null;
function setQty(target,lid,v){
  const l=ORD[target].find(x=>x.lid===lid);if(!l||l.sent)return;
  let q=parseInt((v+'').replace(/\D/g,''))||1;if(q<1)q=1;if(q>999)q=999;
  l.qty=q;
  if(Array.isArray(l.notes)){while(l.notes.length<q)l.notes.push([]);if(l.notes.length>q)l.notes=l.notes.slice(0,q);}
  renderComanda(target);syncMesa(target);
}
function openLineDisc(target,lid){
  const l=ORD[target].find(x=>x.lid===lid);if(!l)return;
  if(l.cort){toastT('Este plato es cortesía (ya va gratis)');return;}
  const gross=l.unit*l.qty;
  const m=document.getElementById('lineModal');
  m.innerHTML=`<div class="modal" style="width:380px"><div class="modal-h"><b>🏷️ Descuento · ${l.n}</b><div class="mx" onclick="closeLineDisc()">✕</div></div>
    <div class="modal-b">
      <div style="font-size:12px;color:var(--txt2);margin-bottom:10px">Precio del plato: <b>${COP(gross)}</b>. Ingresa el descuento en pesos.</div>
      <input class="disc-in" id="lineDiscIn" data-money inputmode="numeric" placeholder="0" value="${l.desc?l.desc.toLocaleString('es-CO'):''}">
      <div style="display:flex;gap:7px;margin-top:10px">
        ${[10,20,50].map(p=>`<button class="btn ghost" style="flex:1;padding:8px" onclick="document.getElementById('lineDiscIn').value=(${Math.round(gross*p/100)}).toLocaleString('es-CO')">${p}%</button>`).join('')}
      </div>
    </div>
    <div class="modal-f"><div style="display:flex;gap:9px">
      ${l.desc?`<button class="btn ghost" style="flex:0 0 auto;padding:12px 15px;color:var(--red)" onclick="confirmLineDisc('${target}',${lid},0)">Quitar</button>`:''}
      <button class="btn primary" style="flex:1" onclick="confirmLineDisc('${target}',${lid},document.getElementById('lineDiscIn').value)">Aplicar descuento</button>
    </div></div></div>`;
  m.classList.add('on');
}
function confirmLineDisc(target,lid,v){
  const l=ORD[target].find(x=>x.lid===lid);if(!l)return;
  let d=parseInt((v+'').replace(/\D/g,''))||0;const gross=l.unit*l.qty;if(d>gross)d=gross;if(d<0)d=0;
  l.desc=d;closeLineDisc();renderComanda(target);syncMesa(target);toastT(d?'Descuento aplicado: '+COP(d):'Descuento quitado');
}
function closeLineDisc(){document.getElementById('lineModal').classList.remove('on');}
function openEditOpts(target,lid){
  const l=ORD[target].find(x=>x.lid===lid);if(!l)return;
  const p=PRODUCTS.find(x=>x.id===l.id);
  if(!p||!p.opts||!p.opts.length){toastT('Este plato no tiene opciones para editar');return;}
  openOpts(target,p,lid);
}
function comandaBody(target){
  const lines=ORD[target]||[];
  if(!lines.length) return `<div class="empty"><div class="ee">🧾</div>Toca un producto para agregarlo a la comanda.</div>`;
  return lines.map((l,idx)=>{
    const o=l.opts.map(x=>x.n+(x.p?` (+${COP(x.p)})`:'')).join(' · ');
    const ns=noteStr(l);
    const gross=l.unit*l.qty;const desc=l.desc||0;const net=l.cort?0:Math.max(0,gross-desc);
    const kstate=l.served?' <span class="served-tag">servido</span>':l.ready?' <span class="ready-tag">✅ listo</span>':l.sent?' <span class="sent-tag">en cocina</span>':'';
    const tags=(l.held?' <span class="held-tag">retenido</span>':'')+(l.cort?' <span class="cort-tag">cortesía</span>':'')+(l.llevar?' <span class="llevar-tag">🥡 para llevar</span>':'')+(desc&&!l.cort?` <span class="disc-tag">🏷️ −${COP(desc)}</span>`:'')+kstate;
    const acc=`<div class="cl-acc">
      <button class="accb b1" title="Notas / observación por unidad" onclick="openNotes('${target}',${l.lid})">🗒️</button>
      <button class="accb b2" title="${l.sent?'Anular este producto (con motivo)':'Quitar del pedido'}" onclick="delLine('${target}',${l.lid})">${l.sent?'🚫':'🗑️'}</button>
      <button class="accb b3 ${l.cort?'on':''}" title="Cortesía (no se cobra)" onclick="toggleCort('${target}',${l.lid})">🎁</button>
      <button class="accb b4 ${l.llevar?'on':''}" title="Para llevar (empacar)" onclick="toggleLlevar('${target}',${l.lid})">🥡</button>
      <button class="accb b5 ${desc?'on':''}" title="Descuento de este plato" onclick="openLineDisc('${target}',${l.lid})">🏷️</button></div>`;
    const qty=l.sent?`<span class="cl-static-q">Cant: ${l.qty}</span>`:`<div class="qstep"><div class="qb" onclick="changeQty('${target}',${l.lid},-1)">−</div><input class="qv-in" inputmode="numeric" value="${l.qty}" onchange="setQty('${target}',${l.lid},this.value)" onclick="this.select()"><div class="qb" onclick="changeQty('${target}',${l.lid},1)">+</div></div>`;
    const price=l.sent?`<div class="cl-pricebox" style="opacity:.6">$ <span class="cl-price-in">${l.unit.toLocaleString('es-CO')}</span></div>`:`<div class="cl-pricebox">$ <input class="cl-price-in" data-money value="${l.unit.toLocaleString('es-CO')}" onchange="changePrice('${target}',${l.lid},this.value)"></div>`;
    const posSel=`<div class="cl-pos">Pos <select class="cl-pos-sel" onchange="setPos('${target}',${l.lid},this.value)">${lines.map((_,i)=>`<option value="${i+1}" ${i===idx?'selected':''}>${i+1}</option>`).join('')}</select></div>`;
    const hold=l.sent?'':`<span class="cl-hold" onclick="toggleHold('${target}',${l.lid})">${l.held?'▶ enviar':'⏸ retener'}</span>`;

function syncMesa(target){
  if(!target.startsWith('mesa_'))return;
  if(typeof _touched!=='undefined' && !_applyingRemote && target){ _touched.add(target); }
  const lines=ORD[target]||[];
  const total=netTotal(lines);
  const nums=target.replace('mesa_','').split('_').filter(Boolean);
  const esUnida = nums.length>1;
  const label = esUnida ? ('Mesa '+nums.map(x=>pad(+x)).join(' + ')) : null;
  const existe = !!ORD[target];   // la comanda existe (aunque esté vacía) → la mesa está tomada
  const fase=(ORDMETA[target]||{}).fase;   // 'precuenta' | 'facturada' → la mesa está "por cobrar", no se pisa
  nums.forEach(x=>{const m=getMesa(+x);if(m){
    if(fase==='precuenta'||fase==='facturada') m.est='cobr';
    else m.est = (esUnida ? existe : lines.length>0) ? 'ocup' : 'libre';
    m.t='ahora'; m.m=total;
    if(esUnida && existe){ m.merged=true; m.grp=target; m.grpLabel=label; }
    else if(!esUnida){ m.merged=false; m.grp=null; m.grpLabel=null; }
  }});
}
/* Reconstruye SIEMPRE las mesas unidas desde las comandas activas (robusto contra estado local viejo:
   una mesa que quedó "pegada" como disponible aunque su comanda unida exista, o un grupo viejo sin comanda). */
function _normalizarMesasUnidas(){
  const grpOf={},labelOf={};
  Object.keys(ORD).forEach(k=>{
    if(!k.startsWith('mesa_'))return;
    const nums=k.replace('mesa_','').split('_').filter(Boolean);
    if(nums.length>1){ const label='Mesa '+nums.map(x=>pad(+x)).join(' + '); nums.forEach(x=>{ grpOf[+x]=k; labelOf[+x]=label; }); }
  });
  MESAS.forEach(m=>{
    if(grpOf[m.n]){ m.merged=true; m.grp=grpOf[m.n]; m.grpLabel=labelOf[m.n]; if(m.est==='libre')m.est='ocup'; }
    else if(m.grp && !ORD[m.grp]){ // grupo viejo cuya comanda ya no existe → soltar la mesa
      m.merged=false; m.grp=null; m.grpLabel=null;
      if(m.est!=='cobr') m.est=(ORD['mesa_'+m.n]&&ORD['mesa_'+m.n].length)?'ocup':'libre';
    }
  });
}

function splitEqual(target){

/* ── Cobro dividido: cada parte con su monto y medio → genera una factura por parte ── */
function splitCheckout(target,mode,n){
  const total=netTotal(ORD[target]);

  if(mode==='iguales'){const per=Math.floor(total/n);parts=Array.from({length:n},(_,i)=>({amount:i===n-1?total-per*(n-1):per,medio:'efectivo'}));}
  else{parts=[{amount:0,medio:'efectivo'},{amount:0,medio:'efectivo'}];}
  window._sc={target,total,parts};
  renderSplitCheckout();
}

  const rows=parts.map((p,i)=>`<div class="sc-row">

function scUpdateSummary(){

/* ── options modal (variantes/adicionales) ── */
function openOpts(target,p,editLid){
  pendingTarget=target;pendingProd=p;pendingSel={};pendingEditLid=editLid||null;
  if(editLid){
    const l=ORD[target].find(x=>x.lid===editLid);const chosen=(l&&l.opts)?l.opts.map(o=>o.n):[];
    p.opts.forEach((g,gi)=>{pendingSel[gi]=[];g.items.forEach((it,ii)=>{if(chosen.includes(it.n))pendingSel[gi].push(ii);});if(g.type==='single'&&g.req&&!pendingSel[gi].length)pendingSel[gi]=[0];});
  }else{
    p.opts.forEach((g,gi)=>{pendingSel[gi]=(g.type==='single'&&g.req)?[0]:[];});
  }
  const m=document.getElementById('optModal');
  m.innerHTML=`<div class="modal"><div class="modal-h"><b>${p.e} ${p.n}${editLid?' · editar':''}</b><div class="mx" onclick="closeOpts()">✕</div></div>
    <div class="modal-b" id="optBody"></div><div class="modal-f"><button class="btn primary" id="optConfirm" onclick="confirmOpts()">${editLid?'Guardar':'Agregar'}</button></div></div>`;
  m.classList.add('on');renderOpts();
}
function renderOpts(){const p=pendingProd;
  document.getElementById('optBody').innerHTML=p.opts.map((g,gi)=>`<div class="optgroup"><div class="ogt"><span>${g.t}</span>${g.req?'<span class="req">Obligatorio</span>':g.type==='multi'?'<span style="color:var(--txt3);font-weight:400;text-transform:none">Opcional · varios</span>':''}</div>
    ${g.items.map((it,ii)=>`<div class="opt${pendingSel[gi].includes(ii)?' sel':''}" onclick="toggleOpt(${gi},${ii})"><div style="display:flex;align-items:center;gap:11px"><div class="oc"></div>${it.n}</div>${it.p?`<span class="op">+${COP(it.p)}</span>`:''}</div>`).join('')}</div>`).join('');
  document.getElementById('optConfirm').textContent=(pendingEditLid?'Guardar · ':'Agregar · ')+COP(pendingProd.pr+extraTotal());
}
function toggleOpt(gi,ii){const g=pendingProd.opts[gi];if(g.type==='single'){pendingSel[gi]=[ii];}else{const a=pendingSel[gi],p=a.indexOf(ii);p>-1?a.splice(p,1):a.push(ii);}renderOpts();}
function extraTotal(){return pendingProd.opts.reduce((s,g,gi)=>s+pendingSel[gi].reduce((a,ii)=>a+g.items[ii].p,0),0);}
function confirmOpts(){
  const sel=[];pendingProd.opts.forEach((g,gi)=>pendingSel[gi].forEach(ii=>sel.push({n:g.items[ii].n,p:g.items[ii].p})));
  if(pendingEditLid){
    const l=ORD[pendingTarget].find(x=>x.lid===pendingEditLid);
    if(l){const extra=sel.reduce((s,o)=>s+o.p,0);l.opts=sel;l.unit=pendingProd.pr+extra;renderComanda(pendingTarget);syncMesa(pendingTarget);toastT('Opciones actualizadas');}
  }else{ addLine(pendingTarget,pendingProd,sel); }
  closeOpts();
}

function pseudoQR(seed){
  const N=21,cell=100/N;let s=(seed*7919+13)%233280;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const finder=(x,y)=>{let r='';for(let i=0;i<7;i++)for(let j=0;j<7;j++){const edge=i===0||i===6||j===0||j===6;const core=i>=2&&i<=4&&j>=2&&j<=4;if(edge||core)r+=`<rect x="${(x+i)*cell}" y="${(y+j)*cell}" width="${cell}" height="${cell}"/>`;}return r;};
  let rects='';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);if(inF)continue;if(rnd()>0.52)rects+=`<rect x="${i*cell}" y="${j*cell}" width="${cell}" height="${cell}"/>`;}
  rects+=finder(0,0)+finder(N-7,0)+finder(0,N-7);
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#fff"/><g fill="#0b1020">${rects}</g></svg>`;
}

function nextMesaN(){return MESAS.reduce((mx,m)=>Math.max(mx,m.n),0)+1;}
function addMesa(amb){const n=nextMesaN();MESAS.push({n,est:'libre',piso:amb,cap:4});if(typeof saveState==='function')saveState();toastT('Mesa '+pad(n)+' creada en '+amb);renderMesasLB(amb);renderAmbientes();if(document.getElementById('comContent'))renderComContent();}
function genMasivo(amb){
  const v=prompt('¿Cuántas mesas quieres generar en '+amb+'?','4');const c=parseInt(v);if(!c||c<1)return;
  for(let i=0;i<c;i++){const n=nextMesaN();MESAS.push({n,est:'libre',piso:amb,cap:4});}
  if(typeof saveState==='function')saveState();toastT(c+' mesas generadas en '+amb);renderMesasLB(amb);renderAmbientes();if(document.getElementById('comContent'))renderComContent();
}
function delMesa(n){
  const mm=getMesa(n);if(!mm)return;const amb=mm.piso;
  const clave=(mm.grp)||('mesa_'+n);
  const tieneComanda=(ORD[clave]&&ORD[clave].length)||mm.est!=='libre';
  const msg=tieneComanda?'La Mesa '+pad(n)+' tiene un pedido activo. Si la eliminas, ese pedido se ANULARÁ y saldrá de cocina. ¿Continuar?':'¿Eliminar la Mesa '+pad(n)+'?';
  if(!confirm(msg))return;
  // Anular/liberar la comanda para NO dejarla huérfana (en cocina/nube) al borrar la mesa
  if(ORD[clave] || mm.est!=='libre'){
    if(clave.startsWith('mesa_')) clave.replace('mesa_','').split('_').forEach(x=>{const m=getMesa(+x);if(m){m.est='libre';m.t='';m.m=0;m.merged=false;m.grp=null;m.grpLabel=null;}});
    delete ORD[clave];delete ORDMETA[clave];delete ORDCAT[clave];
    if(typeof closeComandaCloud==='function')closeComandaCloud(clave);
    if(typeof openTabs!=='undefined'&&openTabs.includes(clave)&&typeof closeTab==='function')closeTab(clave);
  }
  const i=MESAS.findIndex(m=>m.n===n);if(i>=0)MESAS.splice(i,1);
  if(typeof saveState==='function')saveState();
  toastT('Mesa '+pad(n)+' eliminada');
  if(document.getElementById('mesasLB'))renderMesasLB(amb);
  renderAmbientes();if(document.getElementById('comContent'))renderComContent();
}
function delAllMesas(amb){
  const ocupadas=MESAS.filter(m=>m.piso===amb&&(m.est!=='libre'||(ORD[(m.grp)||('mesa_'+m.n)]))).length;
  if(!confirm('¿Eliminar TODAS las mesas de '+amb+'?'+(ocupadas?(' '+ocupadas+' tiene(n) pedido activo, que se ANULARÁ.'):'')+' Esta acción no se puede deshacer.'))return;
  MESAS.filter(m=>m.piso===amb).forEach(m=>{ const clave=(m.grp)||('mesa_'+m.n); if(ORD[clave]){ delete ORD[clave];delete ORDMETA[clave];delete ORDCAT[clave]; if(typeof closeComandaCloud==='function')closeComandaCloud(clave); if(typeof openTabs!=='undefined'&&openTabs.includes(clave)&&typeof closeTab==='function')closeTab(clave); } });
  for(let i=MESAS.length-1;i>=0;i--){if(MESAS[i].piso===amb)MESAS.splice(i,1);}
  if(typeof saveState==='function')saveState();
  toastT('Mesas de '+amb+' eliminadas');renderMesasLB(amb);renderAmbientes();if(document.getElementById('comContent'))renderComContent();
}

function _sameDay(ts,r){const a=new Date(ts);return a.getFullYear()===r.getFullYear()&&a.getMonth()===r.getMonth()&&a.getDate()===r.getDate();}
function _sameMonth(ts,r){const a=new Date(ts);return a.getFullYear()===r.getFullYear()&&a.getMonth()===r.getMonth();}
function refreshDashboard(){const tp=[...document.querySelectorAll('.tabpanel')].find(p=>p.dataset.k==='panel');if(tp)tp.innerHTML=dashboard();}

function dashboard(){
  const now=new Date();

function newId(){ try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}); }
function _isUuid(s){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||''); }
function _cloudReady(){ return !!(sb && window.NEGOCIO_ID); }
let _pulling=false, _catDirty=false, _syncT=null;

/* Quita el grupo de adiciones de DEMO (exactamente: Leche vegetal + Crema batida + Sabor extra),
   aunque no se haya corrido el SQL. Solo toca ese grupo; no afecta otras opciones (Sabor, Tazas, etc.). */
function _esGrupoAdicDemo(g){ try{ const demo=['leche vegetal','crema batida','sabor extra']; const ns=(g&&g.items?g.items:[]).map(it=>(it.n||'').trim().toLowerCase()); return ns.length===demo.length && demo.every(n=>ns.includes(n)); }catch(e){ return false; } }
function _limpiarOpts(opts){ return (opts||[]).filter(g=>!_esGrupoAdicDemo(g)); }
function _sanearProductosDemo(){ try{ let n=0; PRODUCTS.forEach(p=>{ if(p.opts&&p.opts.length){ const before=p.opts.length; p.opts=_limpiarOpts(p.opts); if(p.opts.length!==before)n++; if(!p.opts.length)delete p.opts; } }); if(n&&typeof saveProductos==='function'){ /* no re-subir en bucle */ } return n; }catch(e){ return 0; } }
function _prodRow(p){ return {id:p.id, negocio_id:NEGOCIO_ID, nombre:p.n||'', precio:p.pr||0, categoria:p.cat||'Otros', area:p.area||'COCINA', emoji:p.e||'🍽️', descripcion:p.desc||null, img_url:p.img||null, activo:p.activo!==false, en_panel:p.enPanel!==false, en_qr:p.enQR!==false, recomendado:!!p.rec, opciones:p.opts||[], notas:p.qn||[]}; }
function _rowProd(r){ return {id:r.id, n:r.nombre, pr:r.precio, cat:r.categoria, area:r.area, e:r.emoji, desc:r.descripcion||'', img:r.img_url||'', activo:r.activo, enPanel:r.en_panel, enQR:r.en_qr, rec:r.recomendado, opts:_limpiarOpts(r.opciones||[]), qn:r.notas||[]}; }

// asegura que todo producto tenga UUID (migra ids viejos d1/p12 y arregla líneas abiertas)
function _ensureUuids(){
  const map={};
  PRODUCTS.forEach(p=>{ if(!_isUuid(p.id)){ const nu=newId(); if(p.id)map[p.id]=nu; p.id=nu; } });
  if(Object.keys(map).length){ Object.keys(ORD).forEach(k=>ORD[k].forEach(l=>{ if(map[l.id])l.id=map[l.id]; })); if(typeof saveState==='function')saveState(); }
  return Object.keys(map).length>0;
}

async function pullCatalog(){
  if(!_cloudReady())return;
  try{
    const [pr,ca,ar]=await Promise.all([
      sb.from('productos').select('*').eq('negocio_id',NEGOCIO_ID),
      sb.from('categorias').select('*').eq('negocio_id',NEGOCIO_ID).order('orden'),
      sb.from('areas').select('*').eq('negocio_id',NEGOCIO_ID).order('orden')
    ]);
    if(pr.error||ca.error||ar.error) throw (pr.error||ca.error||ar.error);
    const hasCloud=(pr.data&&pr.data.length)||(ca.data&&ca.data.length)||(ar.data&&ar.data.length);
    if(!hasCloud){ await seedCloud(); return; }   // nube vacía → subir lo local
    _pulling=true;
    if(pr.data&&pr.data.length){ PRODUCTS.length=0; pr.data.forEach(r=>PRODUCTS.push(_rowProd(r))); saveProductos(); }
    if(ca.data&&ca.data.length){ CATS.length=0; CATS.push('Recomendados'); ca.data.forEach(c=>{ if(!CATS.includes(c.nombre))CATS.push(c.nombre); }); saveCats(); }
    if(ar.data&&ar.data.length){ AREAS.length=0; ar.data.forEach(a=>AREAS.push(a.nombre)); saveAreas(); }
    _pulling=false;
    if(typeof renderPrdCats==='function'&&document.querySelector('.tabpanel[data-k="productos"]')){renderPrdCats();renderProductos();}
    if(typeof refreshCatConsumers==='function')refreshCatConsumers();
  }catch(e){ _pulling=false; console.warn('pullCatalog (sigue offline con caché local):',e.message||e); }
}

async function seedCloud(){
  if(!_cloudReady())return;
  try{
    _ensureUuids(); _pulling=true; saveProductos(); _pulling=false;
    if(PRODUCTS.length) await sb.from('productos').upsert(PRODUCTS.map(_prodRow));
    await _pushCatsAreas();
    _catDirty=false;
  }catch(e){ _pulling=false; _catDirty=true; console.warn('seedCloud:',e.message||e); }
}

async function _pushCatsAreas(){
  const cats=CATS.filter(c=>c!=='Recomendados').map((n,i)=>({negocio_id:NEGOCIO_ID,nombre:n,orden:i}));
  const areas=AREAS.map((n,i)=>({negocio_id:NEGOCIO_ID,nombre:n,orden:i}));
  await sb.from('categorias').delete().eq('negocio_id',NEGOCIO_ID);
  if(cats.length) await sb.from('categorias').insert(cats);
  await sb.from('areas').delete().eq('negocio_id',NEGOCIO_ID);
  if(areas.length) await sb.from('areas').insert(areas);
}

function syncCatalog(){   // rebota (debounce) y espeja local → nube
  if(_pulling)return;
  if(!_cloudReady()){ _catDirty=true; return; }
  clearTimeout(_syncT);
  _syncT=setTimeout(async()=>{
    try{
      _ensureUuids();
      const {data:cloudRows,error}=await sb.from('productos').select('id').eq('negocio_id',NEGOCIO_ID); if(error)throw error;
      const localIds=new Set(PRODUCTS.map(p=>p.id));
      const del=(cloudRows||[]).filter(r=>!localIds.has(r.id)).map(r=>r.id);
      if(del.length) await sb.from('productos').delete().eq('negocio_id',NEGOCIO_ID).in('id',del);
      if(PRODUCTS.length) await sb.from('productos').upsert(PRODUCTS.map(_prodRow));
      await _pushCatsAreas();
      _catDirty=false;
    }catch(e){ _catDirty=true; console.warn('syncCatalog (se reintentará al reconectar):',e.message||e); }
  },1200);
}

// reintentar al recuperar conexión
if(typeof window!=='undefined'){ window.addEventListener('online',()=>{ if(_catDirty&&_cloudReady()) syncCatalog(); }); }

/* ═══════════ COMANDAS EN TIEMPO REAL (offline-first) ═══════════ */
const _deviceId = (function(){ try{ let d=sessionStorage.getItem('fenlora_dev'); if(!d){ d=newId().slice(0,8); sessionStorage.setItem('fenlora_dev',d); } return d; }catch(e){ return newId().slice(0,8); } })();
let _applyingRemote=false, _comT=null, _comChannel=null, _comDirty=false;

function _comRow(target){
  const isMesa=target.startsWith('mesa_');
  const meta=Object.assign({}, ORDMETA[target]||{}, {_dev:_deviceId});
  return { negocio_id:NEGOCIO_ID, clave:target, titulo:(ORDMETA[target]&&ORDMETA[target].title)||target,
    tipo:isMesa?'mesa':((target.split('_')[0])||'otro'), estado:'activa', meta:meta, lineas:ORD[target]||[] };
}
let _pendingClose=[];
let _touched=new Set();      // claves que ESTE dispositivo modificó (solo esas se suben)
let _recentClosed=new Set(); // claves pagadas/cerradas (no se vuelven a subir)
async function _flushComandas(){
  if(!_cloudReady())return;
  try{
    const claves=[..._touched].filter(k=>ORD[k] && !_recentClosed.has(k));
    _touched.clear();
    if(claves.length) await sb.from('comandas').upsert(claves.map(_comRow),{onConflict:'negocio_id,clave'});
    if(_pendingClose.length){ const arr=_pendingClose.splice(0); await sb.from('comandas').delete().eq('negocio_id',NEGOCIO_ID).in('clave',arr); }
    _comDirty=false;
  }catch(e){ _comDirty=true; console.warn('pushComandas (se reintenta):',e.message||e); }
}
function pushComandasSoon(immediate){
  if(_applyingRemote)return;
  if(!_cloudReady()){ _comDirty=true; return; }
  clearTimeout(_comT);
  if(immediate){ _flushComandas(); return; }
  _comT=setTimeout(_flushComandas, 250);
}
function _comClosedRow(clave){
  const isMesa=clave.startsWith('mesa_');
  return { negocio_id:NEGOCIO_ID, clave, titulo:(ORDMETA[clave]&&ORDMETA[clave].title)||clave,
    tipo:isMesa?'mesa':((clave.split('_')[0])||'otro'), estado:'cerrada', meta:{_dev:_deviceId}, lineas:[] };
}
/* Cierra la comanda (pago o anulación) y la libera en TODOS los dispositivos.
   Clave del arreglo: NO borramos directo (el DELETE de Realtime no siempre trae la 'clave' a los otros
   equipos → por eso la mesa no se liberaba). Primero marcamos estado='cerrada' con un UPSERT: eso dispara
   un UPDATE de Realtime CON la fila completa (incluida la clave) en cada dispositivo, que libera la mesa.
   Luego sí borramos la fila para dejar la nube limpia. */
async function closeComandaCloud(clave){
  if(!clave)return;
  _recentClosed.add(clave); _touched.delete(clave);
  if(!_cloudReady()){ _comDirty=true; return; }
  try{
    await sb.from('comandas').upsert(_comClosedRow(clave),{onConflict:'negocio_id,clave'}); // → UPDATE realtime con clave → libera mesa en todos
    await sb.from('comandas').delete().eq('negocio_id',NEGOCIO_ID).eq('clave',clave);        // limpieza
  }catch(e){ _comDirty=true; console.warn('closeComandaCloud (se reintenta):',e.message||e); }
}
async function pullComandas(){
  if(!_cloudReady())return;
  try{
    const {data,error}=await sb.from('comandas').select('*').eq('estado','activa'); if(error)throw error;
    _applyingRemote=true;
    const _remotas=new Set();
    (data||[]).forEach(r=>{ if(!r.clave)return; _remotas.add(r.clave); ORD[r.clave]=r.lineas||[]; ORDMETA[r.clave]=r.meta||{}; if(ORDCAT[r.clave]==null)ORDCAT[r.clave]='Recomendados'; if(typeof syncMesa==='function')syncMesa(r.clave); });
    // RECONCILIACIÓN (auto-limpieza): toda comanda local que YA no está activa en la nube
    // (anulada o cobrada en otro dispositivo) se elimina y su mesa se libera. Así no hay que borrar caché a mano.
    Object.keys(ORD).forEach(k=>{
      if(_remotas.has(k))return;
      if(_touched.has(k))return;   // algo que ESTE equipo acaba de crear y aún no sube → no lo borres
      if(k===active)return;        // comanda abierta que estoy editando ahora mismo → no la quites de golpe
      if(typeof openTabs!=='undefined' && openTabs.includes(k))return; // pestaña abierta → solo la cierra un cierre remoto real (evita carrera durante creación)
      delete ORD[k]; delete ORDMETA[k]; delete ORDCAT[k];

function _authMsg(e){const m=(e&&e.message)||String(e);if(/Invalid login/i.test(m))return'Correo o contraseña incorrectos.';if(/already registered/i.test(m))return'Ese correo ya tiene cuenta. Inicia sesión.';if(/at least 6/i.test(m))return'La contraseña debe tener al menos 6 caracteres.';if(/Email not confirmed/i.test(m))return'Debes confirmar tu correo antes de entrar.';return m;}

async function authSubmit(){
  if(!sb)return;const email=(document.getElementById('authEmail').value||'').trim();const pass=document.getElementById('authPass').value||'';
  if(!email||!pass){authErr('Ingresa correo y contraseña');return;}
  authErr('');authBusy(true);
  try{
    if(authMode==='register'){
      const {data,error}=await sb.auth.signUp({email,password:pass});if(error)throw error;
      if(data.session){await afterLogin(data.user);}
      else{authBusy(false);authMode='login';renderAuth();authErr('Cuenta creada. Confirma tu correo y luego inicia sesión.');}
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;
      await afterLogin(data.user);
    }
  }catch(e){authBusy(false);authErr(_authMsg(e));}
}
/* ═══════════ SELECTOR DE PERFILES + PIN (entrada de empleados) ═══════════ */
let _pinPerfil=null,_pinBuf='',_pinFirst='',_pinMode='enter';
async function _hashPin(id,pin){
  try{ const data=new TextEncoder().encode(String(id)+'|'+String(pin)+'|fenlora-pin'); const buf=await crypto.subtle.digest('SHA-256',data); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ const str=id+'|'+pin+'|fenlora'; let h=5381; for(let i=0;i<str.length;i++)h=((h*33)^str.charCodeAt(i))>>>0; return 'f'+h.toString(16); }
}
function showPerfiles(){ authMode='perfil'; document.body.classList.remove('authed'); renderAuth(); }
function cambiarUsuario(){ if(typeof closeTopMenus==='function')closeTopMenus(); try{localStorage.removeItem('fenlora_perfil');}catch(e){} window._empleado=null; showPerfiles(); }
function _perfilesHTML(){
  const modo=_modoPersonal();
  const rolLbl={mesero:'Mesero',cajero:'Cajero',cocina:'Cocina'};
  let emps=EMPLEADOS.filter(e=>e.rol!=='admin'&&e.activo!==false);
  if(modo) emps=emps.filter(e=>e.rol===modo);
  const titulo=(_marcaNegocio()!=='Panel del Negocio'?_marcaNegocio()+' · ':'')+(modo?(rolLbl[modo]+'s'):'¿Quién eres?');
  let cuerpo;
  if(!emps.length){
    cuerpo='<div class="dash-empty" style="margin:10px 0">Aún no hay '+(modo?rolLbl[modo].toLowerCase()+'s':'personal')+' registrados. Pídele al administrador que te agregue.</div>';
  } else {
    cuerpo='<div class="perfil-grid">'+emps.map(e=>`<div class="perfil-tile" onclick="pickPerfil('${e.id}')"><div class="perfil-av">${(e.nombre[0]||'?').toUpperCase()}</div><div class="perfil-n">${e.nombre}</div><div class="perfil-r">${rolLbl[e.rol]||e.rol}</div></div>`).join('')+'</div>';
  }
  return `<div class="auth-card wide"><div class="auth-logo">🔥 FENLORA CLOUD</div><div class="auth-sub">${titulo}</div>
    ${cuerpo}
    <div class="auth-alt"><span onclick="cerrarSesion()">Cerrar sesión del negocio</span></div></div>`;
}
function _pinHTML(){
  const p=_pinPerfil||{};
  const title=_pinMode==='enter'?('Hola '+(p.nombre||'')):_pinMode==='create1'?('Crea tu PIN, '+(p.nombre||'')):'Confirma tu PIN';
  const sub=_pinMode==='enter'?'Ingresa tu PIN de 4 dígitos':_pinMode==='create1'?'Elige un PIN de 4 dígitos (no lo olvides)':'Escríbelo otra vez';
  const dots=[0,1,2,3].map(i=>`<span class="pin-dot ${_pinBuf.length>i?'on':''}"></span>`).join('');
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" onclick="pinKey('${n}')">${n}</button>`).join('');
  return `<div class="auth-card"><div class="auth-logo">🔥 FENLORA</div><div class="auth-sub">${title}</div>
    <div class="pin-sub">${sub}</div>
    <div class="pin-dots">${dots}</div>
    <div id="pinErr" class="auth-err" style="text-align:center"></div>
    <div class="pin-pad">${keys}<button class="pin-key ghostk" onclick="pinBack()">↩</button><button class="pin-key" onclick="pinKey('0')">0</button><button class="pin-key ghostk" onclick="pinDel()">⌫</button></div></div>`;
}
function pickPerfil(id){ const e=EMPLEADOS.find(x=>x.id===id); if(!e)return; _pinPerfil=e;_pinBuf='';_pinFirst='';_pinMode=e.pin?'enter':'create1';authMode='pin';renderAuth(); }
function pickAdminPerfil(){ let a=EMPLEADOS.find(x=>x.rol==='admin'); if(!a){a={id:newId(),nombre:'Administrador',rol:'admin',pin:false,hash:null,_new:true};} _pinPerfil=a;_pinBuf='';_pinFirst='';_pinMode=a.pin?'enter':'create1';authMode='pin';renderAuth(); }
function pinKey(n){ if(_pinBuf.length>=4)return; _pinBuf+=String(n); renderAuth(); if(_pinBuf.length===4) setTimeout(_pinComplete,120); }
function pinDel(){ _pinBuf=_pinBuf.slice(0,-1); renderAuth(); }
function pinBack(){ _pinBuf='';_pinFirst=''; showPerfiles(); }
async function _verifyPin(perfil,pin){ const h=await _hashPin(perfil.id,pin); return h===perfil.hash; }
async function _savePin(perfil,hash){
  if(perfil._new){ EMPLEADOS.push({id:perfil.id,nombre:perfil.nombre,rol:perfil.rol,pin:true,hash:hash,activo:true}); if(_cloudReady()){try{await sb.from('empleados').insert({id:perfil.id,negocio_id:NEGOCIO_ID,nombre:perfil.nombre,rol:perfil.rol,pin_hash:hash});}catch(e){}} }
  else { const e=EMPLEADOS.find(x=>x.id===perfil.id); if(e){e.pin=true;e.hash=hash;} if(_cloudReady()){try{await sb.from('empleados').update({pin_hash:hash}).eq('id',perfil.id);}catch(e){}} }
  saveEmpleados();
}
async function _pinComplete(){
  const p=_pinPerfil; if(!p)return;
  if(_pinMode==='enter'){
    const ok=await _verifyPin(p,_pinBuf);
    if(ok){ entrarComoPerfil({id:p.id,nombre:p.nombre,rol:p.rol}); }
    else { _pinBuf=''; renderAuth(); const e=document.getElementById('pinErr'); if(e)e.textContent='PIN incorrecto, intenta de nuevo'; }
  } else if(_pinMode==='create1'){ _pinFirst=_pinBuf;_pinBuf='';_pinMode='create2';renderAuth(); }
  else { if(_pinBuf===_pinFirst){ const h=await _hashPin(p.id,_pinBuf); await _savePin(p,h); entrarComoPerfil({id:p.id,nombre:p.nombre,rol:p.rol}); }
    else { _pinBuf='';_pinFirst='';_pinMode='create1';renderAuth(); const e=document.getElementById('pinErr'); if(e)e.textContent='Los PIN no coinciden, empecemos otra vez'; } }
}
function entrarComoPerfil(perfil){
  window._empleado=perfil; window.ROL=perfil.rol; window._realRol=perfil.rol;
  try{localStorage.setItem('fenlora_perfil',JSON.stringify(perfil));}catch(e){}
  hideAuth(); window.__booted=true; bootPanel();
}
/* Limpia TODO lo específico de un negocio (caché local + memoria). Se llama al cambiar de negocio
   o al cerrar sesión, para que un negocio NUNCA vea datos (productos, facturas, caja) de otro
   en el mismo navegador. Causa raíz de varias fugas entre tenants. */
function _limpiarCachesNegocio(){
  ['fenlora_productos','fenlora_facturas','fenlora_anulaciones','fenlora_cierres','fenlora_caja','fenlora_estado','fenlora_cats','fenlora_areas','fenlora_empleados','fenlora_perfil','fenlora_rol','fenlora_menustyle','fenlora_qropts'].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  try{ PRODUCTS.length=0; }catch(e){}
  try{ FACTURAS.length=0; }catch(e){}
  try{ ANULACIONES.length=0; }catch(e){}
  try{ CIERRES.length=0; }catch(e){}
  try{ if(typeof EMPLEADOS!=='undefined')EMPLEADOS.length=0; }catch(e){}
  try{ CAJA=null; }catch(e){}
  try{ CATS.length=0; CATS.push('Recomendados'); }catch(e){}
  try{ AREAS.length=0; AREAS.push('COCINA','BARRA'); }catch(e){}
  try{ Object.keys(ORD).forEach(k=>delete ORD[k]); Object.keys(ORDMETA).forEach(k=>delete ORDMETA[k]); Object.keys(ORDCAT).forEach(k=>delete ORDCAT[k]); }catch(e){}
  try{ MESAS.forEach(m=>{m.est='libre';m.t='';m.m=0;m.grp=null;m.grpLabel=null;m.merged=false;m.mesero=null;}); }catch(e){}
  try{ if(typeof _kdsPrevState!=='undefined')_kdsPrevState={}; if(typeof _fasePrev!=='undefined')_fasePrev={}; }catch(e){}
}
async function afterLogin(user){
  window._authUser=user;
  try{ const {data:es}=await sb.rpc('es_super_admin'); window._esSuper=!!es; }catch(e){ window._esSuper=false; }let negId=null;let verificado=false;
  // Consultar la membresía con reintentos (por si la conexión tarda)
  for(let i=0;i<3 && !negId;i++){
    try{
      const {data:mem,error}=await sb.from('miembros').select('negocio_id,rol').limit(1);
      if(error) throw error;
      verificado=true;
      if(mem && mem.length){ negId=mem[0].negocio_id; window.ROL=mem[0].rol||'admin'; window._realRol=window.ROL; try{localStorage.setItem('fenlora_rol',window.ROL);}catch(e){} break; }
      break; // consulta OK y vacía → usuario realmente sin negocio
    }catch(e){ await new Promise(r=>setTimeout(r,700)); }
  }
  // Respaldo: caché local de este dispositivo
  if(!negId){ const cache=localStorage.getItem('fenlora_negocio'); if(cache) negId=cache; }
  if(!window.ROL){ window.ROL=localStorage.getItem('fenlora_rol')||'admin'; }
  if(!window._realRol){ window._realRol=window.ROL; }
  if(!negId){
    if(verificado){ authBusy(false); showAuth('onboarding'); return; }   // confirmado nuevo → crear
    // No se pudo verificar (sin internet): NO crear negocio nuevo, avisar
    authBusy(false); showAuth('login');
    authErr('No pudimos verificar tu negocio (revisa tu conexión). Intenta ingresar de nuevo.');
    return;
  }
  // Seguridad multi-tenant: en un subdominio de negocio, la sesión debe ser de ESE negocio
  if(window._tenantNeg && negId && negId!==window._tenantNeg.id){
    if(typeof authBusy==='function')authBusy(false);
    showAuth('login');
    if(typeof authErr==='function')authErr('Esta cuenta no pertenece a '+window._tenantNeg.nombre+'. Usa la cuenta de este negocio.');
    return;
  }
  try{ const _prev=localStorage.getItem('fenlora_negocio'); if(_prev && _prev!==negId && typeof _limpiarCachesNegocio==='function'){ _limpiarCachesNegocio(); } }catch(e){}   // cambió de negocio → no arrastrar datos del anterior
  window.NEGOCIO_ID=negId;try{localStorage.setItem('fenlora_negocio',negId);}catch(e){}
  if(typeof pullEmpleados==='function'){ try{ await pullEmpleados(); }catch(e){} }
  if(_esModoMeseros() && EMPLEADOS.some(e=>e.activo!==false)){
    if(typeof authBusy==='function')authBusy(false);
    // Restaurar la sesión guardada del empleado en ESTE dispositivo (celular personal) → no re-pedir PIN al reabrir la app.
    try{
      const saved=JSON.parse(localStorage.getItem('fenlora_perfil')||'null');
      const modo=_modoPersonal();
      if(saved && saved.id){
        const emp=EMPLEADOS.find(e=>e.id===saved.id && e.activo!==false && (!modo || e.rol===modo));
        if(emp){ entrarComoPerfil({id:emp.id,nombre:emp.nombre,rol:emp.rol}); return; }
      }
    }catch(e){}
    showPerfiles(); return;
  }
  window.ROL=window._realRol||'admin'; window._empleado=null;
  hideAuth();if(!window.__booted){window.__booted=true;bootPanel();}
}
async function crearNegocioSubmit(){
  if(!sb)return;const nombre=(document.getElementById('obNombre').value||'').trim();const sede=(document.getElementById('obSede').value||'').trim()||'Principal';
  if(!nombre){authErr('Escribe el nombre del negocio');return;}
  authErr('');authBusy(true);
  try{const {data,error}=await sb.rpc('crear_negocio',{p_nombre:nombre,p_sede:sede});if(error)throw error;
    try{ if(typeof _limpiarCachesNegocio==='function')_limpiarCachesNegocio(); }catch(e){}   // negocio nuevo arranca limpio
    window.NEGOCIO_ID=data;try{localStorage.setItem('fenlora_negocio',data);}catch(e){}
    hideAuth();if(!window.__booted){window.__booted=true;bootPanel();}
  }catch(e){authBusy(false);authErr('No se pudo crear el negocio: '+(_authMsg(e)));}
}
async function cerrarSesion(){try{if(sb)await sb.auth.signOut();}catch(e){}try{if(typeof _limpiarCachesNegocio==='function')_limpiarCachesNegocio();}catch(e){}try{localStorage.removeItem('fenlora_negocio');}catch(e){}window.NEGOCIO_ID=null;window.__booted=false;showAuth('login');}
/* ─── PWA: app instalable + auto-actualización ─── */
function _buildManifest(){
  try{
    const nombre=(window._tenantNeg&&window._tenantNeg.nombre)?window._tenantNeg.nombre:'FENLORA CLOUD';
    const esMeseros=_esModoMeseros();
    const base=window._tenant?('/'+window._tenant):'';
    const appName=nombre+(esMeseros?' · Meseros':'');
    const m={ name:appName, short_name:nombre.slice(0,14), description:'Sistema POS · '+nombre,
      start_url:(esMeseros?(base+'/meseros'):(base+'/'))||'/', scope:(base+'/')||'/', display:'standalone', orientation:'any',
      background_color:'#080D1A', theme_color:'#0E1525', lang:'es',
      icons:[{src:'./icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},
             {src:'./icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}] };
    const blob=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
    const url=URL.createObjectURL(blob);
    let link=document.getElementById('appManifest');
    if(!link){ link=document.createElement('link'); link.rel='manifest'; link.id='appManifest'; document.head.appendChild(link); }
    else if(link.href&&link.href.indexOf('blob:')===0){ try{URL.revokeObjectURL(link.href);}catch(e){} }
    link.href=url;
  }catch(e){}
}
let _deferredPrompt=null;
if(typeof window!=='undefined'){
  window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); _deferredPrompt=e; });
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{ try{reg.update();}catch(e){}
        setInterval(()=>{ try{reg.update();}catch(e){} }, 60000); // revisa updates cada minuto
      }).catch(()=>{});
      // Si ya había un SW controlando y entra uno nuevo → recargar una vez para mostrar lo último
      if(navigator.serviceWorker.controller){
        let _rec=false;
        navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_rec)return; _rec=true; location.reload(); });
      }
    });
  }
}
async function instalarApp(){
  if(typeof closeTopMenus==='function')closeTopMenus();
  if(_deferredPrompt){ _deferredPrompt.prompt(); try{await _deferredPrompt.userChoice;}catch(e){} _deferredPrompt=null; }
  else { toastT('Para instalar: abre el menú del navegador (⋮) y elige "Instalar app" o "Agregar a pantalla de inicio"'); }
}
_buildManifest();
/* ─── MULTI-TENANT POR DOMINIO (pos = maestro; sub.dominio = negocio) ─── */
function _tenantFromPath(){
  try{
    const segs=(location.pathname||'/').split('/').filter(Boolean);
    if(!segs.length) return null;          // raíz = MAESTRO (Fenlora)
    if(segs[0]==='meseros') return null;   // /meseros suelto = maestro
    return segs[0].toLowerCase();          // primer segmento = negocio
  }catch(e){ return null; }
}
function _modoPersonal(){ try{ const p=(location.pathname||'').toLowerCase(); if(/\/meseros\/?$/.test(p))return 'mesero'; if(/\/caja\/?$/.test(p))return 'cajero'; if(/\/cocina\/?$/.test(p))return 'cocina'; return null; }catch(e){ return null; } }
function _esModoMeseros(){ return !!_modoPersonal(); }
window._tenant=_tenantFromPath();
window._tenantNeg=null;
function _marcaNegocio(){ return (window._tenantNeg&&window._tenantNeg.nombre)?window._tenantNeg.nombre:'Panel del Negocio'; }
function _saludoNombre(){ if(window._tenant && window._tenantNeg && window._tenantNeg.nombre) return window._tenantNeg.nombre; return 'Fenlora'; }
async function resolveTenant(){
  window._tenantNeg=null;
  if(!window._tenant||!sb) return;
  try{ const {data,error}=await sb.rpc('negocio_por_subdominio',{p_sub:window._tenant}); if(error)throw error;
    if(data&&data.length){ window._tenantNeg={id:data[0].id,nombre:data[0].nombre,sub:window._tenant}; if(typeof _buildManifest==='function')_buildManifest(); }
  }catch(e){ console.warn('resolveTenant:',e.message||e); }
}
async function initAuth(){
  if(!sb){showAuth('offline');return;}
  await resolveTenant();
  try{const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){await afterLogin(session.user);}else{showAuth('login');}
  }catch(e){showAuth('login');}
}
initAuth();
