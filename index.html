<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1525">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FENLORA">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>FENLORA CLOUD — Panel del Negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080D1A;--surface:#0E1525;--card:#141E33;--card2:#1A2540;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --primary:#00E5A0;--primary-dim:rgba(0,229,160,.12);--primary-dim2:rgba(0,229,160,.06);
  --amber:#F5A623;--amber-dim:rgba(245,166,35,.14);
  --red:#FF4D6D;--red-dim:rgba(255,77,109,.12);
  --blue:#3B82F6;--blue-dim:rgba(59,130,246,.12);
  --purple:#A78BFA;--purple-dim:rgba(167,139,250,.14);
  --txt:#F0F4FF;--txt2:#8892A4;--txt3:#4A5568;
  --sidebar-w:246px;--hdr:60px;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Figtree',sans-serif;overflow:hidden}
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hdr{height:var(--hdr);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:26px;scrollbar-width:thin;scrollbar-color:var(--card2) transparent}
.content::-webkit-scrollbar{width:8px}.content::-webkit-scrollbar-thumb{background:var(--card2);border-radius:8px}

/* TABS (browser-style) */
.tabstrip{display:flex;align-items:center;gap:3px;background:var(--surface);border-bottom:1px solid var(--border);padding:7px 12px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:9px 9px 0 0;background:transparent;color:var(--txt2);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid transparent;border-bottom:none;position:relative;top:1px;max-width:200px}
.tab:hover{background:var(--card);color:var(--txt)}
.tab.active{background:var(--bg);color:var(--txt);border-color:var(--border)}
.tab .ti{font-size:13px;flex-shrink:0}
.tab .tl{overflow:hidden;text-overflow:ellipsis}
.tab .tx{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--txt3);flex-shrink:0}
.tab .tx:hover{background:var(--red-dim);color:var(--red)}
.tab .pin{font-size:11px;color:var(--txt3)}
.tab.dragging{opacity:.4}
.tab.dragover{border-left:2px solid var(--primary)}
.tab-actions{margin-left:auto;flex-shrink:0;padding-left:8px}
.closeall{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);color:var(--txt2);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit;margin-bottom:6px}
.closeall:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.ctxmenu{position:fixed;z-index:200;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:5px;min-width:190px;box-shadow:0 16px 40px -10px rgba(0,0,0,.7);display:none}
.ctxmenu.on{display:block}
.ctxmenu .ci{padding:9px 12px;border-radius:7px;font-size:12.5px;color:var(--txt);cursor:pointer;display:flex;align-items:center;gap:9px}
.ctxmenu .ci:hover{background:var(--primary-dim);color:var(--primary)}
.ctxmenu .ci.disabled{color:var(--txt3);pointer-events:none;opacity:.5}
.ctxmenu .sep{height:1px;background:var(--border);margin:4px 6px}
.toast-t{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--amber);color:var(--amber);font-size:13px;font-weight:600;padding:11px 20px;border-radius:11px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast-t.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabpanel{display:none}
.tabpanel.on{display:block}

/* ─── TOMAR PEDIDO ─── */
.tp{display:grid;grid-template-columns:1fr 350px;gap:20px;align-items:start}
.tp-ctx{grid-column:1/-1;display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 18px;margin-bottom:4px;flex-wrap:wrap}
.tp-ctx .mesa-sel{display:flex;align-items:center;gap:9px;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px}
.tp-ctx .mesa-sel .mm-ic{width:32px;height:32px;border-radius:8px;background:var(--amber-dim);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:16px}
.tp-ctx .ctx-i{font-size:12px;color:var(--txt2)}.tp-ctx .ctx-i b{color:var(--txt);font-weight:600}
.tp-ctx .divx{width:1px;height:26px;background:var(--border)}
.tp-search2{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--txt3)}
.tp-search2 input{background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:14px;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 15px;border-radius:22px;background:var(--card);border:1px solid var(--border);color:var(--txt2);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--border2);color:var(--txt)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#052e21}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.prod{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;cursor:pointer;transition:.15s;position:relative}
.prod:hover{transform:translateY(-2px);border-color:var(--primary);background:var(--card2)}
.prod:active{transform:scale(.97)}
.prod .pe{font-size:30px;margin-bottom:8px}
.prod .pn{font-size:13px;font-weight:600;line-height:1.2;min-height:32px}
.prod .pp{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--primary);margin-top:6px}
.prod .popt{position:absolute;top:10px;right:10px;font-size:9px;font-weight:700;background:var(--amber-dim);color:var(--amber);padding:2px 7px;border-radius:10px}
.prod .padd{position:absolute;bottom:14px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:300;line-height:0}

/* COMANDA panel */
.comanda{position:sticky;top:0;background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100dvh - 150px)}
.comanda-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.comanda-h b{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700}
.comanda-h .cnt{font-size:11px;color:var(--txt2);background:var(--card2);padding:3px 9px;border-radius:12px;font-weight:600}
.comanda-body{flex:1;overflow-y:auto;padding:12px 14px;scrollbar-width:thin}
.comanda-body::-webkit-scrollbar{width:6px}.comanda-body::-webkit-scrollbar-thumb{background:var(--card2);border-radius:6px}
.empty{text-align:center;color:var(--txt3);padding:40px 20px;font-size:13px}
.empty .ee{font-size:40px;margin-bottom:12px;opacity:.5}
.cl{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.cl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cl-name{font-size:13px;font-weight:600;line-height:1.2}
.cl-opts{font-size:10.5px;color:var(--txt2);margin-top:3px;line-height:1.4}
.cl-rm{color:var(--txt3);cursor:pointer;font-size:13px;flex-shrink:0}.cl-rm:hover{color:var(--red)}
.cl-bot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.qstep{display:flex;align-items:center;gap:9px}
.qb{width:25px;height:25px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--txt);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qb:hover{border-color:var(--primary);color:var(--primary)}
.qv{font-size:13px;font-weight:700;min-width:14px;text-align:center}
.cl-price{font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;color:var(--primary)}
.comanda-f{border-top:1px solid var(--border);padding:14px 18px}
.trow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--txt2);margin-bottom:7px}
.trow.tot{font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:var(--txt);border-top:1px solid var(--border);padding-top:10px;margin-top:3px}
.trow.tot .tv{color:var(--primary)}
.comanda-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{padding:12px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:#052e21}
.btn.primary:hover{box-shadow:0 8px 20px -6px rgba(0,229,160,.5)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--border2)}
.btn.two{flex-direction:row}
.btn-row{display:flex;gap:8px}.btn-row .btn{flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* OPTIONS MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:260;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:440px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 70px -15px rgba(0,0,0,.7)}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h b{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700}
.modal-h .mx{width:32px;height:32px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2)}
.modal-b{padding:18px 20px;overflow-y:auto}
.optgroup{margin-bottom:20px}
.optgroup .ogt{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--txt2);margin-bottom:10px;display:flex;justify-content:space-between}
.optgroup .req{color:var(--amber);font-size:10px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13.5px;transition:.15s}
.opt:hover{border-color:var(--border2)}
.opt.sel{border-color:var(--primary);background:var(--primary-dim)}
.opt .oc{width:19px;height:19px;border-radius:50%;border:2px solid var(--txt3);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.sel .oc{border-color:var(--primary);background:var(--primary)}
.opt.sel .oc::after{content:'';width:7px;height:7px;border-radius:50%;background:#052e21}
.opt .op{color:var(--primary);font-weight:600;font-size:12.5px}
.modal-f{padding:16px 20px;border-top:1px solid var(--border)}

/* COMANDAS: type filters + mesa map */
.comtypes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.comtype{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;background:var(--card);border:1px solid var(--border);color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.comtype:hover{border-color:var(--border2);color:var(--txt)}
.comtype.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.comtype .ct-badge{background:var(--card2);color:var(--txt2);font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px}
.comtype.active .ct-badge{background:var(--primary);color:#052e21}
.mesas-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mesas-head b{font-family:'Outfit',sans-serif;font-size:15px}
.mesa-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mesa{border-radius:15px;padding:18px;color:#fff;cursor:pointer;position:relative;min-height:118px;transition:.15s;border:1px solid transparent}
.mesa:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.mesa:active{transform:scale(.98)}
.mesa.libre{background:linear-gradient(140deg,#12a56f,#0b7d53)}
.mesa.ocup{background:linear-gradient(140deg,#d98a1f,#b06b11)}
.mesa.cobr{background:linear-gradient(140deg,#d0384f,#9e2739)}
.mesa .mesa-ic{position:absolute;top:14px;right:15px;font-size:18px;opacity:.5}
.mesa .mesa-n{font-family:'Outfit',sans-serif;font-weight:700;font-size:18px;margin-top:6px}
.mesa .mesa-s{font-size:11.5px;opacity:.92;margin-top:4px}
.mesa .mesa-m{position:absolute;bottom:16px;left:18px;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px}
.empty-type{text-align:center;padding:50px 20px;background:var(--card);border:1px dashed var(--border2);border-radius:16px}
.empty-type .et-ic{font-size:48px;margin-bottom:14px}
.empty-type .et-t{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700}
.empty-type .et-d{font-size:13px;color:var(--txt2);margin-top:6px;max-width:340px;margin-left:auto;margin-right:auto;line-height:1.5}
.cl.sent{opacity:.6}
.cl.sent .cl-name{color:var(--primary)}
.cl.held{border-style:dashed;border-color:var(--amber)}
.cl-hold{font-size:10.5px;color:var(--amber);cursor:pointer;font-weight:700;margin-right:10px}
.cl-hold:hover{text-decoration:underline}
.held-tag{font-size:9px;background:var(--amber-dim);color:var(--amber);padding:1px 7px;border-radius:10px;font-weight:700;vertical-align:middle}
.unir-bar{background:var(--card2);border:1px solid var(--primary);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;font-weight:600}
.mesa.sel{outline:3px solid var(--primary);outline-offset:2px}

/* BRAND */
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#00b381);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.brand-name{font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.3px}
.brand-sub{font-size:10px;color:var(--primary);letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}

/* NAV */
.nav{padding:12px 10px;flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--card2) transparent}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:var(--card2);border-radius:6px}
.nav-section{font-size:10px;color:var(--txt3);letter-spacing:1.2px;text-transform:uppercase;padding:14px 10px 6px;font-weight:700}
#previewBar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100000;background:var(--amber,#F59E0B);color:#151515;padding:10px 16px;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;max-width:92vw}
#previewBar button{background:#151515;color:#fff;border:none;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.neg-form{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.nf{margin-bottom:13px}
.nf label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px;font-weight:500}
.nf-row{display:flex;gap:12px}
.nf-row .nf{flex:1;min-width:0}
.neg-alertbar{background:var(--amber,#f59e0b);color:#151515;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px}
.neg-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;flex-wrap:wrap}
.neg-card.susp{opacity:.6}
.neg-name{font-weight:600;font-size:14.5px}
.neg-meta{font-size:12px;color:var(--txt2);margin-top:3px}
.neg-meta a{color:var(--primary);text-decoration:none}
.neg-badge.susp{background:var(--red,#ef4444);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:600}
.neg-alert{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:600;margin-left:4px}
.neg-alert.venc{background:var(--red,#ef4444);color:#fff}
.neg-alert.pronto{background:var(--amber,#f59e0b);color:#151515}
.neg-acts{display:flex;gap:7px;flex-wrap:wrap}
.auth-card.wide{max-width:440px}
.perfil-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0 4px}
.perfil-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.15s}
.perfil-tile:hover{border-color:var(--primary);transform:translateY(-2px)}
.perfil-tile.admin{background:var(--primary-dim)}
.perfil-av{width:48px;height:48px;border-radius:50%;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin:0 auto 8px;font-family:'Outfit',sans-serif}
.perfil-tile.admin .perfil-av{background:var(--primary);color:#fff}
.perfil-n{font-weight:600;font-size:13.5px}
.perfil-r{font-size:11px;color:var(--txt2);margin-top:2px}
.pin-sub{text-align:center;color:var(--txt2);font-size:13px;margin:-4px 0 14px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0 14px}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);transition:.15s}
.pin-dot.on{background:var(--primary);border-color:var(--primary)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pin-key{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 0;font-size:20px;font-weight:600;cursor:pointer;color:var(--txt);font-family:'Outfit',sans-serif}
.pin-key:hover{border-color:var(--primary)}
.pin-key.ghostk{background:transparent;font-size:17px;color:var(--txt2)}
.emp-add{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.emp-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;flex-wrap:wrap}
.emp-info{display:flex;align-items:center;gap:12px}
.emp-av{width:40px;height:40px;border-radius:50%;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;font-family:'Outfit',sans-serif}
.emp-name{font-weight:600;font-size:14.5px}
.emp-meta{font-size:12px;color:var(--txt2);margin-top:2px}
.emp-pin-ok{color:var(--green,#22c55e);font-weight:600}
.emp-pin-no{color:var(--amber,#f59e0b);font-weight:600}
.emp-acts{display:flex;gap:7px;flex-wrap:wrap}
.btn.ghost{background:var(--primary-dim2);color:var(--txt);border:1px solid var(--border);width:auto;padding:8px 12px;font-size:12.5px;border-radius:8px;cursor:pointer}
.btn.ghost.danger{color:var(--red,#ef4444)}
.tm-sub{padding:8px 13px 4px;font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2);transition:.15s;margin-bottom:1px;font-weight:500;position:relative}
.nav-item:hover{background:var(--primary-dim2);color:var(--txt)}
.nav-item.active{background:var(--primary-dim);color:var(--primary)}
.nav-item .ico{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.activo{background:var(--primary);box-shadow:0 0 6px var(--primary)}
.dot.construccion{background:var(--amber)}
.dot.pronto{background:var(--txt3)}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}

/* HEADER */
.hdr-left{display:flex;align-items:center;gap:14px}
.biz-sel{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:600}
.biz-sel .bl{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#F5A623,#c9761e);display:flex;align-items:center;justify-content:center;font-size:13px}
.biz-sel .cv{color:var(--txt3);font-size:11px}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;width:280px;color:var(--txt3);font-size:13px}
.search input{background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:13px;flex:1}
.hdr-right{display:flex;align-items:center;gap:12px}
.hicon{width:38px;height:38px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative}
.hicon:hover{border-color:var(--border2)}
.hicon .rd{position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}
.avatar{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#00b381);display:flex;align-items:center;justify-content:center;font-weight:700;color:#062;cursor:pointer}

/* PAGE HEAD */
.page-head{margin-bottom:22px}
.page-head h1{font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:12px}
.page-head .sub{color:var(--txt2);font-size:13.5px;margin-top:4px}
.status-pill{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.status-pill.activo{background:var(--primary-dim);color:var(--primary)}
.status-pill.construccion{background:var(--amber-dim);color:var(--amber)}
.status-pill.pronto{background:rgba(255,255,255,.06);color:var(--txt2)}
.fase-tag{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--card2);color:var(--txt2)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .kt{font-size:11.5px;color:var(--txt2);font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.kpi .kv{font-family:'Outfit',sans-serif;font-size:25px;font-weight:700;margin-top:8px;letter-spacing:-.5px}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:600}
.kpi .kd.up{color:var(--primary)}.kpi .kd.down{color:var(--red)}.kpi .kd.n{color:var(--txt2)}
.kpi .kico{position:absolute;top:14px;right:16px;font-size:17px;opacity:.5}
.kpi.hl{border-color:rgba(0,229,160,.3);background:linear-gradient(135deg,var(--primary-dim),var(--card))}

/* QUICK ACCESS */
.section-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;margin:26px 0 14px;color:var(--txt);display:flex;align-items:center;gap:9px}
.qa-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.qa{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 12px;text-align:center;cursor:pointer;transition:.16s}
.qa:hover{transform:translateY(-2px);border-color:var(--border2);background:var(--card2)}
.qa .qi{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 9px}
.qa .qn{font-size:12px;font-weight:600;color:var(--txt)}
.qa .qs{font-size:9.5px;margin-top:3px}

/* PLACEHOLDER (module not built yet) */
.ph{max-width:720px}
.ph-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.ph-desc{color:var(--txt2);font-size:14px;line-height:1.65;margin-bottom:22px}
.ph-feat-title{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--txt3);margin-bottom:12px}
.ph-feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-feat .f{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--txt);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.ph-feat .f .fc{color:var(--primary);flex-shrink:0;font-size:13px;margin-top:1px}
.ph-note{margin-top:22px;padding:14px 16px;background:var(--amber-dim);border:1px solid rgba(245,166,35,.25);border-radius:11px;font-size:13px;color:#f5cf8f;display:flex;gap:11px;align-items:flex-start}

/* mini table for mesas preview on dashboard */
.mini-mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:11px}
.mm{border-radius:12px;padding:14px;color:#fff;position:relative;min-height:78px}
.mm.libre{background:linear-gradient(135deg,#12a56f,#0c7d54)}
.mm.ocup{background:linear-gradient(135deg,#d98a1f,#b56e12)}
.mm.cobr{background:linear-gradient(135deg,#c9384f,#9e2739)}
.mm .mn{font-weight:700;font-size:14px}
.mm .ms{font-size:10.5px;opacity:.9;margin-top:2px}
.mm .mp{position:absolute;bottom:12px;right:13px;font-weight:700;font-size:13px}
@media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.qa-grid{grid-template-columns:repeat(4,1fr)}.ph-feat{grid-template-columns:1fr}}

/* ═══ COMANDA v2 (estilo ApiWorking, tema oscuro) ═══ */
.tp{grid-template-columns:1fr 438px !important}
.tp-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.tp-toolbar .tp-search2{margin-bottom:0;flex:1}
.view-toggle{display:flex;background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0}
.view-toggle button{background:none;border:none;color:var(--txt3);padding:9px 12px;cursor:pointer;font-size:15px;font-family:inherit}
.view-toggle button.on{background:var(--primary-dim);color:var(--primary)}

/* vista lista */
.prod-list{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;cursor:pointer;transition:.13s}
.prow:hover{border-color:var(--primary);background:var(--card2)}
.prow .pe2{font-size:22px;flex-shrink:0}
.prow .pn2{flex:1;font-size:13.5px;font-weight:600}
.prow .popt2{font-size:9px;font-weight:700;background:var(--amber-dim);color:var(--amber);padding:2px 8px;border-radius:10px}
.prow .pp2{font-family:'Outfit',sans-serif;font-weight:700;color:var(--primary);font-size:14px}
.prow .padd2{width:26px;height:26px;border-radius:50%;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:300;flex-shrink:0}

/* meta bar de la comanda */
.comanda-meta{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:11.5px;color:var(--txt2)}
.cm-field{display:flex;align-items:center;gap:6px}
.cm-field select{background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:inherit;font-size:11.5px;padding:5px 8px;outline:none;cursor:pointer;max-width:130px}
.cm-com{display:flex;align-items:center;gap:7px}
.cm-com .qb{width:22px;height:22px;font-size:14px}
.ver-mesas{background:var(--card2);border:1px solid var(--border);color:var(--txt);font-size:11px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif}
.ver-mesas:hover{border-color:var(--primary);color:var(--primary)}

/* línea rica */
.cl-head{display:flex;gap:9px;align-items:flex-start}
.cl-acc{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.accb{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:0;line-height:0}
.accb.b1{color:var(--blue)}.accb.b1:hover{background:var(--blue-dim);border-color:var(--blue)}
.accb.b2{color:var(--red)}.accb.b2:hover{background:var(--red-dim);border-color:var(--red)}
.accb.b3{color:var(--primary)}.accb.b3:hover{background:var(--primary-dim);border-color:var(--primary)}
.accb.b3.on{background:var(--primary);color:#052e21;border-color:var(--primary)}
.cl-info{flex:1;min-width:0}
.cl-notes{font-size:10.5px;color:var(--amber);font-style:italic;margin-top:4px;line-height:1.35}
.cl-area{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.4px;background:var(--card);color:var(--txt3);border:1px solid var(--border);padding:1px 6px;border-radius:8px;margin-top:5px}
.cort-tag{font-size:9px;background:var(--primary-dim);color:var(--primary);padding:1px 7px;border-radius:10px;font-weight:700;vertical-align:middle}
.sent-tag{font-size:9px;background:var(--primary-dim);color:var(--primary);padding:1px 7px;border-radius:10px;font-weight:700;vertical-align:middle}
.cl.cort{border-color:rgba(0,229,160,.3)}
.cl-ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cl-pricebox{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:3px 7px;font-size:12px;color:var(--txt3)}
.cl-price-in{width:62px;background:none;border:none;outline:none;color:var(--primary);font-family:'Outfit',sans-serif;font-weight:700;font-size:12.5px;text-align:right}
.cl-imp{font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;color:var(--txt);margin-left:auto}
.cl-pos{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--txt3)}
.cl-pos-sel{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--txt);font-family:inherit;font-size:11px;padding:3px 4px;outline:none;cursor:pointer}
.cl-static-q{font-size:11px;color:var(--txt3)}

/* footer: comensal + obs */
.cf-fields{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.cf-in{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.cf-in .lb{font-size:11px;color:var(--txt3);flex-shrink:0;min-width:74px}
.cf-in input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:12.5px}
.trow.cortr{color:var(--primary)}

/* 4 botones de guardado */
.save-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sbtn{padding:11px 10px;border-radius:10px;border:1px solid var(--border);font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.14s;line-height:1.15;text-align:center;background:var(--card2);color:var(--txt)}
.sbtn:hover{border-color:var(--border2);transform:translateY(-1px)}
.sbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.sbtn .si{font-size:15px}
.sbtn.prod{background:var(--amber-dim);border-color:rgba(245,166,35,.35);color:var(--amber)}
.sbtn.fact{background:var(--primary);border-color:var(--primary);color:#052e21}
.sbtn.fact:hover{box-shadow:0 8px 18px -6px rgba(0,229,160,.5)}
.sec-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.sec-row .btn{flex:1 1 45%;padding:9px;font-size:11.5px}
.sec-row .sec-danger{color:var(--red)}
.sec-row .sec-danger:hover{border-color:var(--red);background:var(--red-dim)}

/* mesa acciones */
.mesa-act{position:absolute;top:12px;left:14px;width:26px;height:26px;border-radius:7px;background:rgba(0,0,0,.28);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;padding:0}
.mesa-act:hover{background:rgba(0,0,0,.5)}
.amb-title{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:9px;color:var(--txt)}
.amb-title:first-of-type{margin-top:0}
.amb-cnt{font-size:11px;color:var(--txt2);background:var(--card2);padding:2px 9px;border-radius:11px;font-weight:600}
.act-list{display:flex;flex-direction:column;gap:8px}
.act-item{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:13px 15px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--txt);transition:.14s}
.act-item:hover{border-color:var(--primary);background:var(--primary-dim)}
.act-item .ai{font-size:17px;width:22px;text-align:center}
.act-item.danger:hover{border-color:var(--red);background:var(--red-dim);color:var(--red)}

/* notas modal */
.note-unit{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px}
.note-unit .nut{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--txt2);text-transform:uppercase;margin-bottom:9px}
.note-in{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;margin-bottom:10px}
.note-in:focus{border-color:var(--primary)}
.qn-lbl{font-size:10.5px;color:var(--txt3);margin-bottom:7px}
.qn-row{display:flex;flex-wrap:wrap;gap:6px}
.qn-btn{font-size:11px;font-weight:700;letter-spacing:.3px;background:var(--surface);border:1px solid var(--border);color:var(--txt2);padding:6px 11px;border-radius:8px;cursor:pointer;transition:.13s;font-family:inherit}
.qn-btn:hover{border-color:var(--border2);color:var(--txt)}
.qn-btn.on{background:var(--amber);border-color:var(--amber);color:#3a2a06}
.note-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.note-tag{font-size:10.5px;background:var(--amber-dim);color:var(--amber);padding:3px 9px;border-radius:9px;font-weight:600;display:flex;align-items:center;gap:6px}
.note-tag .rmx{cursor:pointer;opacity:.7}.note-tag .rmx:hover{opacity:1}

/* pago modal */
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:18px}
.pay-m{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:14px 8px;text-align:center;cursor:pointer;transition:.14s}
.pay-m:hover{border-color:var(--border2)}
.pay-m.on{border-color:var(--primary);background:var(--primary-dim)}
.pay-m .pmi{font-size:22px}
.pay-m .pml{font-size:11.5px;font-weight:600;margin-top:5px;color:var(--txt)}
.pay-sec{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3);margin:6px 0 9px}
.tip-row{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.tip-b{flex:1;min-width:52px;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 6px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--txt);transition:.13s}
.tip-b:hover{border-color:var(--border2)}
.tip-b.on{border-color:var(--primary);background:var(--primary-dim);color:var(--primary)}
.disc-in{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;margin-bottom:16px}
.disc-in:focus{border-color:var(--primary)}
.pay-sum{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:6px}

/* tickets impresos */
.ticket-wrap{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-height:52vh;overflow-y:auto;padding:4px}
.ticket{background:#fff;color:#111;border-radius:6px;padding:16px 18px;width:270px;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.5;box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
.ticket .tk-c{text-align:center}
.ticket .tk-b{font-weight:700}
.ticket .tk-big{font-size:15px;font-weight:700}
.ticket .tk-hr{border-top:1px dashed #999;margin:8px 0}
.ticket .tk-row{display:flex;justify-content:space-between;gap:8px}
.ticket .tk-note{font-style:italic;font-size:10px;color:#444;padding-left:10px}
.ticket .tk-foot{text-align:center;font-size:9.5px;color:#666;margin-top:8px}
.print-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ── Layout POS: header/meta/campos fijos, lista con scroll propio, botones fijos abajo ── */
.comanda{overflow:hidden;max-height:calc(100dvh - 96px)}
.comanda-h,.comanda-meta,.comanda-fields,.comanda-f{flex-shrink:0}
.comanda-body{flex:1 1 auto;min-height:96px;overflow-y:auto;padding:12px 14px;scrollbar-width:thin;scrollbar-color:var(--card2) transparent}
.comanda-body::-webkit-scrollbar{width:6px}.comanda-body::-webkit-scrollbar-thumb{background:var(--card2);border-radius:6px}
.comanda-fields{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border)}
.comanda-fields .cf-in{flex:1;min-width:0;padding:7px 10px;margin:0}
.comanda-fields .cf-in input{font-size:12px}
.cl-addnote{font-size:11px;color:var(--blue);cursor:pointer;margin-top:6px;display:inline-flex;align-items:center;gap:5px;opacity:.9;font-weight:600}
.cl-addnote:hover{opacity:1;text-decoration:underline}
.cl-notes{cursor:pointer}
.cl-notes .edit-note{font-style:normal;color:var(--txt3);font-size:9px;text-decoration:underline;margin-left:4px}

/* ── Módulo Mesas / QR / NFC ── */
.qr-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;margin-bottom:6px}
.qr-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.qr-card h3{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;margin-bottom:4px}
.qr-card .qsub{font-size:12.5px;color:var(--txt2);margin-bottom:16px;line-height:1.5}
.opt-toggle{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--card2);cursor:pointer;transition:.14s}
.opt-toggle:hover{border-color:var(--border2)}
.opt-toggle .oi{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.opt-toggle .ot{flex:1;min-width:0}
.opt-toggle .ot b{font-size:13.5px;font-weight:600;display:block}
.opt-toggle .ot span{font-size:11px;color:var(--txt2)}
.sw{width:44px;height:25px;border-radius:20px;background:var(--card);border:1px solid var(--border2);position:relative;flex-shrink:0;transition:.18s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--txt3);transition:.18s}
.opt-toggle.on .sw{background:var(--primary);border-color:var(--primary)}
.opt-toggle.on .sw::after{left:22px;background:#052e21}
.opt-toggle.on{border-color:rgba(0,229,160,.3)}
.phone{width:272px;margin:0 auto;background:#0a0f1c;border:8px solid #1a2035;border-radius:34px;padding:14px 13px 20px;box-shadow:0 20px 50px -15px rgba(0,0,0,.7)}
.phone-notch{width:88px;height:5px;background:#2a3350;border-radius:6px;margin:2px auto 14px}
.phone-brand{text-align:center;margin-bottom:16px}
.phone-brand .pb-logo{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#00b381);display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto 8px}
.phone-brand .pb-n{font-family:'Outfit',sans-serif;font-weight:700;font-size:15px}
.phone-brand .pb-m{font-size:11px;color:var(--txt2)}
.phone-btn{display:flex;align-items:center;gap:11px;background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:9px;font-size:13px;font-weight:600;color:var(--txt)}
.phone-btn .pbi{font-size:18px}
.phone-btn.primary{background:var(--primary);color:#052e21;border-color:var(--primary)}
.phone-empty{text-align:center;color:var(--txt3);font-size:11px;padding:24px 10px;line-height:1.5}
.qr-mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-bottom:8px}

.amb-info{flex:1;min-width:0}

.mi.edit{color:var(--primary)}.mi.edit:hover{background:var(--primary-dim);border-color:var(--primary)}

.mi.link{color:var(--amber)}.mi.link:hover{background:var(--amber-dim);border-color:var(--amber)}

.lb-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lb-toolbar button{background:var(--card2);border:1px solid var(--border);color:var(--txt);font-size:12px;font-weight:700;padding:9px 13px;border-radius:9px;cursor:pointer;font-family:inherit}
.lb-toolbar button:hover{border-color:var(--primary);color:var(--primary)}
.lb-toolbar button.danger{color:var(--red)}.lb-toolbar button.danger:hover{border-color:var(--red);background:var(--red-dim)}
.mrow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:9px 12px;margin-bottom:8px}
.mrow-num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#12a56f,#0b7d53);color:#fff;font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.mrow-name{flex:1;font-family:'Outfit',sans-serif;font-weight:600;font-size:13.5px}
.mrow-name span{color:var(--txt2);font-weight:400;font-size:12px}
.mrow-name em{color:var(--amber);font-style:normal;font-size:11px}

.lb-legend{font-size:11px;color:var(--txt3);margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid var(--border);padding-top:12px}
.lb-legend .lg{display:inline-flex;align-items:center;gap:4px}
.lb-legend .lg.edit{color:var(--primary)}.lb-legend .lg.del{color:var(--red)}.lb-legend .lg.qr{color:var(--blue)}.lb-legend .lg.link{color:var(--amber)}

/* ── Mockup de celular premium ── */
.phone2{width:288px;margin:0 auto;background:linear-gradient(155deg,#2c3654,#141a2e);border-radius:46px;padding:5px;box-shadow:0 30px 60px -18px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.07)}
.phone2-screen{background:radial-gradient(120% 80% at 50% 0%,#12203c 0%,#0b1224 55%,#0a0f1e 100%);border-radius:42px;overflow:hidden;position:relative;min-height:566px;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:86px;height:23px;background:#000;border-radius:14px;z-index:6}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 2px;color:#fff;position:relative;z-index:4}
.statusbar .sb-time{font-family:'Outfit',sans-serif;font-weight:700;font-size:13px}
.statusbar .sb-icons{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.scr-body{flex:1;padding:16px 16px 6px;overflow:hidden}
.scr-hero{text-align:center;margin:10px 0 18px}
.hero-logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#00b381);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 10px;box-shadow:0 10px 24px -6px rgba(0,229,160,.55)}
.hero-name{font-family:'Outfit',sans-serif;font-weight:800;font-size:19px;color:#fff;letter-spacing:-.3px}
.hero-sub{font-size:11.5px;color:#8892a4;margin-top:4px}
.scr-welcome{font-size:10px;color:#6b7488;text-align:center;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:13px;font-weight:700}
.scr-btn{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:13px 14px;margin-bottom:10px}
.scr-btn .sbc{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:18px}
.scr-btn .sbt{font-size:13.5px;font-weight:600;color:#f0f4ff}
.scr-btn.primary{background:linear-gradient(135deg,var(--primary),#00c88d);border-color:transparent;box-shadow:0 8px 20px -8px rgba(0,229,160,.5)}
.scr-btn.primary .sbt{color:#052e21;font-weight:700}
.scr-btn.primary .sbc{background:rgba(5,46,33,.16)}
.clubvip{background:linear-gradient(140deg,rgba(245,166,35,.18),rgba(245,166,35,.04));border:1px solid rgba(245,166,35,.32);border-radius:15px;padding:14px;margin-top:6px}
.clubvip .cv-t{font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:7px}
.clubvip .cv-d{font-size:10.5px;color:#d3b06f;margin:6px 0 11px;line-height:1.45}
.clubvip .cv-d b{color:var(--amber)}
.clubvip .cv-in{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;font-size:11px;color:#7f8aa0;margin-bottom:7px}
.clubvip .cv-btn{background:var(--amber);color:#3a2a06;border-radius:9px;padding:9px;text-align:center;font-size:11.5px;font-weight:700;margin-top:2px}
.home-ind{width:124px;height:4px;background:rgba(255,255,255,.3);border-radius:4px;margin:4px auto 10px}

/* ── Clúster de mesas unidas (compacto, tarjetas tamaño normal) ── */
.mesa-cluster{display:inline-block;vertical-align:top;border:1.5px dashed var(--primary);background:linear-gradient(180deg,rgba(0,229,160,.07),rgba(0,229,160,.01));border-radius:16px;padding:10px 12px 12px;margin:0 14px 14px 0;position:relative;max-width:100%;box-sizing:border-box}
.cluster-rib{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:#052e21;background:var(--primary);padding:4px 12px;border-radius:20px;margin-bottom:10px;box-shadow:0 6px 14px -6px rgba(0,229,160,.6)}
/* Envuelven DENTRO del recuadro discontinuo (2 arriba, 1 abajo…), nunca se salen ni provocan scroll horizontal */
.cluster-body{display:flex;align-items:stretch;flex-wrap:wrap;gap:10px;justify-content:flex-start}
.cluster-body .mesa{flex:0 1 160px;width:160px;max-width:100%;margin:0}
.cluster-link{flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--primary);align-self:center}
/* En móvil: el clúster ocupa todo el ancho y las mesas caben 2 por fila, la 3ª baja, todo dentro del recuadro */
@media(max-width:560px){
  .mesa-cluster{display:block;width:100%;margin-right:0}
  .cluster-body{gap:8px;justify-content:center}
  .cluster-body .mesa{flex:1 1 44%;width:auto;min-width:128px;max-width:calc(50% - 8px)}
  .cluster-link{display:none}  /* el 🔗 entre tarjetas estorba al envolver; el rótulo de arriba ya indica que están unidas */
}

/* ── Aviso GRANDE al mesero cuando cocina marca el pedido listo ── */
.listo-ov{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(3,10,8,.74);backdrop-filter:blur(4px);padding:20px}
.listo-ov.on{display:flex;animation:listoIn .22s ease}
@keyframes listoIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.listo-card{position:relative;background:linear-gradient(180deg,#0b3b2b,#062018);border:2px solid var(--primary);border-radius:24px;padding:34px 26px;text-align:center;max-width:430px;width:100%;box-shadow:0 30px 80px -18px rgba(0,229,160,.6)}
.listo-x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;line-height:1}
.listo-x:hover{background:rgba(255,255,255,.2)}
.listo-card.cuenta{background:linear-gradient(180deg,#3d2a08,#201404);border-color:var(--amber);box-shadow:0 30px 80px -18px rgba(245,197,66,.55)}
.listo-card.cuenta .listo-t{color:var(--amber)}
.listo-card.cuenta .listo-btn{background:var(--amber);color:#241a02}
.listo-emoji{font-size:64px;line-height:1;animation:listoPulse 1s infinite}
@keyframes listoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.listo-t{font-family:'Outfit',sans-serif;font-weight:800;font-size:25px;letter-spacing:1px;color:var(--primary);margin-top:8px}
.listo-mesa{font-family:'Outfit',sans-serif;font-weight:800;font-size:34px;color:#fff;margin-top:2px}
.listo-sub{font-size:14px;color:#bfeede;margin-top:10px}
.listo-btn{margin-top:22px;width:100%;background:var(--primary);color:#052e21;border:none;border-radius:14px;padding:16px;font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;cursor:pointer}

/* ── Info extra en las tarjetas de mesa ── */
.mesa{display:flex;flex-direction:column;min-height:128px}
.mesa-m{position:static !important;margin-top:auto;padding-top:8px}
.mesa-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mb{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.22);color:#fff;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mb.k-ready{background:rgba(255,255,255,.92);color:#0b7d53}
.mb.alert{color:#111}
.mb.alert.mesero{background:#fff;color:#a15a10;animation:mbpulse 1.4s infinite}
.mb.alert.cuenta{background:#fff;color:#9e2739;animation:mbpulse 1.4s infinite}
@keyframes mbpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{transform:scale(1.05);box-shadow:0 0 0 5px rgba(255,255,255,0)}}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tdot.g{background:#39d98a}.tdot.a{background:#f5c542}
.tdot.r{background:#ff5b5b;animation:mbpulse 1.6s infinite}

/* ── Dashboard real (facturas) ── */
.dash-2col{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media(max-width:1100px){.dash-2col{grid-template-columns:1fr}}
.fact-list{display:flex;flex-direction:column;gap:8px}
.fact-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;cursor:pointer;transition:.13s}
.fact-row:hover{border-color:var(--primary)}
.fact-row .fr-ic{width:34px;height:34px;border-radius:9px;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.fact-row .fr-mid{flex:1;min-width:0}
.fact-row .fr-mid b{font-size:13px;font-weight:600;display:block}
.fact-row .fr-mid span{font-size:11px;color:var(--txt2)}
.fact-row .fr-tot{font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;color:var(--primary);flex-shrink:0}
.medio-list{display:flex;flex-direction:column;gap:7px}
.medio-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:12.5px}
.medio-row b{font-family:'Outfit',sans-serif;font-size:13px}
.dash-empty{background:var(--card);border:1px dashed var(--border2);border-radius:12px;padding:22px;font-size:12.5px;color:var(--txt2);line-height:1.7;text-align:center}

/* ── Banner de cuenta dividida en el cobro ── */
.split-banner{background:var(--amber-dim);border:1px solid rgba(245,166,35,.35);color:var(--amber);font-size:12.5px;font-weight:700;padding:10px 13px;border-radius:10px;margin-bottom:16px;text-align:center}

/* ── Cobro dividido (filas de pago) ── */
.sc-list{display:flex;flex-direction:column;gap:9px}
.sc-row{display:flex;align-items:center;gap:8px}
.sc-row .sc-i{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sc-amt{flex:1;min-width:0;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.sc-amt:focus{border-color:var(--primary)}
.sc-med{background:var(--card2);border:1px solid var(--border);border-radius:9px;color:var(--txt);font-family:inherit;font-size:12px;padding:9px;outline:none;cursor:pointer;flex-shrink:0}
.sc-x{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--red);cursor:pointer;flex-shrink:0;font-size:12px}
.sc-x:hover{border-color:var(--red);background:var(--red-dim)}

/* ── Tarjetas de pedidos no-mesa (llevar/domicilio/online) reabribles ── */
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.order-card{background:linear-gradient(160deg,#d98a1f,#c47a15);border:none;border-radius:16px;padding:16px;cursor:pointer;color:#fff;transition:.14s;position:relative;min-height:120px;display:flex;flex-direction:column}
.order-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(217,138,31,.55)}
.order-card.cobr{background:linear-gradient(160deg,#d64560,#b33049)}
.order-card .oc-top{display:flex;align-items:center;gap:9px;font-family:'Outfit',sans-serif;font-weight:700;font-size:15px}
.order-card .oc-ico{font-size:18px}
.order-card .oc-sub{font-size:11.5px;opacity:.92;margin-top:5px}
.order-card .oc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.order-card .oc-foot{margin-top:auto;padding-top:10px}
.order-card .oc-tot{font-family:'Outfit',sans-serif;font-weight:800;font-size:17px}

/* ── Marcador "Para llevar" por plato ── */
.accb.b4{color:var(--amber)}.accb.b4:hover{background:var(--amber-dim);border-color:var(--amber)}
.accb.b4.on{background:var(--amber);color:#3a2a06;border-color:var(--amber)}
.llevar-tag{font-size:9px;background:var(--amber-dim);color:var(--amber);padding:1px 7px;border-radius:10px;font-weight:700;vertical-align:middle}

.content{-webkit-overflow-scrolling:touch}
/* comanda: header+meta fijos, resto en un solo scroll (no recorta los botones) */
.comanda{overflow:hidden}
.comanda-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--card2) transparent}
.comanda-scroll::-webkit-scrollbar{width:6px}.comanda-scroll::-webkit-scrollbar-thumb{background:var(--card2);border-radius:6px}
.comanda-body{flex:none !important;overflow:visible !important;min-height:auto !important}
/* vista de pantalla completa de la comanda */
.fullview{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
.fullview.on{display:flex}
.fv-head{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.fv-head b{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;display:flex;align-items:center;gap:11px}
.fv-x{background:var(--card2);border:1px solid var(--border);color:var(--txt);font-weight:700;padding:11px 20px;border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px}
.fv-x:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.fv-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 22px}
.fv-list{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px;align-items:start}
@media(max-width:900px){.fv-list{grid-template-columns:1fr}}
.fv-foot{flex-shrink:0;border-top:1px solid var(--border);padding:15px 22px;background:var(--surface)}
.fv-foot>*{max-width:1360px;margin-left:auto;margin-right:auto}
@media(max-width:1200px){
  .tp{grid-template-columns:1fr !important;gap:16px}
  .comanda{position:static !important;max-height:none !important;overflow:visible !important}
  .comanda-scroll{overflow:visible !important;min-height:auto}
  .comanda-body{max-height:none !important;overflow:visible !important;min-height:auto !important;flex:none !important}
  .modal{max-height:92vh}
}
@media(max-width:640px){
  .content{padding:16px}
  .save-grid{grid-template-columns:1fr 1fr}
  .kpi-grid{grid-template-columns:1fr 1fr !important}
}
/* footer compacto en la vista de pantalla completa (PC) */
.fv-foot .trow{padding:2px 0}
.fv-foot .save-grid{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.fv-foot .sbtn{flex-direction:row;gap:8px;padding:12px 10px;min-height:auto;font-size:12.5px}
.fv-foot .sbtn .si{font-size:15px}
.fv-foot .sec-row{margin-top:8px;flex-wrap:nowrap}
.fv-foot .sec-row .btn{flex:1 1 0}
@media(max-width:820px){.fv-foot .save-grid{grid-template-columns:1fr 1fr}.fv-foot .sec-row{flex-wrap:wrap}.fv-foot .sec-row .btn{flex:1 1 45%}}

/* menús desplegables de la barra superior */
.topmenu{position:fixed;top:64px;right:18px;z-index:270;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:0 20px 50px -12px rgba(0,0,0,.7);width:320px;max-width:calc(100vw - 24px);display:none;overflow:hidden}
.topmenu.on{display:block}
.tm-head{padding:13px 16px;border-bottom:1px solid var(--border);font-family:'Outfit',sans-serif;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
.tm-list{max-height:60vh;overflow-y:auto}
.tm-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:default}
.tm-item .tmi{width:34px;height:34px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tm-item .tmt{flex:1;min-width:0}
.tm-item .tmt b{font-size:12.5px;font-weight:600;display:block}
.tm-item .tmt span{font-size:11px;color:var(--txt2)}
.tm-empty{padding:26px 16px;text-align:center;color:var(--txt2);font-size:12.5px}
.tm-act{padding:12px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.tm-act:hover{background:var(--card2)}

const GROUPS=['Fenlora','Operación','Catálogo','Inventario','Clientes','Automatizaciones','Facturación','Equipo','Análisis','Configuración'];

/* build nav */
const nav=document.getElementById('nav');
/* ─── ROLES: qué ve cada quién ─── */
function _puedeCobrar(){ const r=window.ROL||'admin'; return r==='admin'||r==='cajero'; }
function _puedeCocina(){ const r=window.ROL||'admin'; return r==='cocina'||r==='admin'; }  // solo cocina o admin marca listo/entregado
function _canSee(k){ if(k==='negocios') return !!window._esSuper && !window._tenant; const rol=window.ROL||'admin'; if(rol==='admin')return true;
  const allow={mesero:['mesas','cocina'],cajero:['mesas','cocina','caja'],cocina:['cocina']};
  const base=allow[rol]||[];
  // Pestañas dinámicas de comandas (mesa_1, delivery_1, etc.) se permiten si el rol puede ver Mesas
  const esComanda = /^(mesa_|delivery|llevar|barra_|pickup|dom_)/.test(k) || (typeof DYN!=='undefined'&&DYN&&DYN[k]);
  if(esComanda) return base.includes('mesas');
  return base.includes(k); }
function _homeTab(){ const rol=window.ROL||'admin'; return rol==='mesero'?'mesas':rol==='cocina'?'cocina':rol==='cajero'?'caja':'panel'; }
function renderNav(){
  nav.innerHTML='';
  GROUPS.forEach(g=>{
    const keys=Object.keys(S).filter(k=>S[k].g===g&&_canSee(k));
    if(!keys.length)return;
    const sec=document.createElement('div');sec.className='nav-section';sec.textContent=g;nav.appendChild(sec);
    keys.forEach(k=>{
      const it=S[k];const d=document.createElement('div');d.className='nav-item'+(k===(window.HOME||'panel')?' active':'');d.dataset.k=k;
      d.innerHTML=`<span class="ico">${it.ico}</span><span class="lbl">${it.n}</span>`+
        (it.badge?`<span class="nav-badge">${it.badge}</span>`:`<span class="dot ${it.st}"></span>`);
      d.onclick=()=>{openTab(k);closeNav();};nav.appendChild(d);
    });
  });
}
renderNav();

const content=document.getElementById('content');
const tabbar=document.getElementById('tabbar');
const ctxmenu=document.getElementById('ctxmenu');
const MAX_TABS=8;
let openTabs=['panel'], active=null; let HOME='panel';
const scrollPos={};
const tName=k=>k==='panel'?'Panel':(DYN[k]?DYN[k].title:S[k].n);
const tIco =k=>k==='panel'?'📊':(DYN[k]?DYN[k].ico:S[k].ico);

function toastT(msg){
  const t=document.getElementById('toastT');t.textContent=msg;t.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),2200);
}

function renderTabs(){
  const closable=openTabs.filter(k=>k!=='panel').length;
  tabbar.innerHTML=openTabs.map((k,idx)=>`
    <div class="tab${k===active?' active':''}" draggable="true" data-idx="${idx}" data-k="${k}"
      onclick="switchTab('${k}')"
      onauxclick="if(event.button===1){event.preventDefault();closeTab('${k}')}"
      oncontextmenu="showCtx(event,'${k}')">
      <span class="ti">${tIco(k)}</span><span class="tl">${tName(k)}</span>
      ${k===HOME?'<span class="pin">📌</span>':`<span class="tx" onclick="event.stopPropagation();closeTab('${k}')">✕</span>`}
    </div>`).join('') + (closable>0?`<div class="tab-actions"><button class="closeall" onclick="closeAll()">✕ Cerrar todas</button></div>`:'');
  wireDrag();
}
function buildPanel(k){
  const d=document.createElement('div');d.className='tabpanel';d.dataset.k=k;
  d.innerHTML = k==='panel' ? dashboard() : k==='mesas' ? comandasView() : k==='cocina' ? kdsView() : k==='caja' ? cajaView() : k==='reportes' ? reportesView() : k==='categorias' ? categoriasView() : k==='empleados' ? empleadosView() : k==='negocios' ? negociosView() : k==='productos' ? productosView() : k==='ambientes' ? qrConfigView() : (DYN[k] ? DYN[k].render() : moduleView(k));
  content.appendChild(d);
  if(k==='mesas') initComandas();
  else if(k==='cocina') initKds();
  else if(k==='caja') initCaja();
  else if(k==='categorias') initCategorias();
  else if(k==='empleados') initEmpleados();
  else if(k==='negocios') initNegocios();
  else if(k==='reportes') initReportes();
  else if(k==='productos') initProductos();
  else if(k==='ambientes') initQrConfig();
  else if(DYN[k]) DYN[k].init();
}
function toggleNav(){document.body.classList.toggle("nav-open");}
function closeNav(){document.body.classList.remove("nav-open");}
function switchTab(k){
  if(active && active!==k) scrollPos[active]=content.scrollTop;
  active=k;
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('on',p.dataset.k===k));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.k===k));
  renderTabs();
  if(k==='mesas' && document.getElementById('comContent')) renderComContent();
  if(k==='panel' && typeof refreshDashboard==='function') refreshDashboard();
  content.scrollTop=scrollPos[k]||0;
}
function openTab(k){
  if(typeof _canSee==='function'&&!_canSee(k)){return;}
  if(!openTabs.includes(k)){
    if(openTabs.length>=MAX_TABS){toastT('Máximo '+MAX_TABS+' pestañas abiertas. Cierra alguna para abrir otra.');return;}
    openTabs.push(k);buildPanel(k);
  }
  switchTab(k);
}
function closeTab(k){
  const i=openTabs.indexOf(k);
  if(i<0||k===HOME)return;
  if(window._fullTarget===k && typeof closeFull==='function') closeFull();
  openTabs.splice(i,1);
  const p=document.querySelector(`.tabpanel[data-k="${k}"]`);if(p)p.remove();
  delete scrollPos[k];
  if(active===k) switchTab(openTabs[i]||openTabs[i-1]||'panel');
  else renderTabs();
}
function closeAll(){
  openTabs.filter(k=>k!=='panel').forEach(k=>{const p=document.querySelector(`.tabpanel[data-k="${k}"]`);if(p)p.remove();delete scrollPos[k];});
  openTabs=['panel'];switchTab('panel');
}
function closeOthers(keep){
  openTabs.filter(k=>k!=='panel'&&k!==keep).forEach(k=>{const p=document.querySelector(`.tabpanel[data-k="${k}"]`);if(p)p.remove();delete scrollPos[k];});
  openTabs=keep==='panel'?['panel']:['panel',keep];switchTab(keep);
}
function closeRight(from){
  const i=openTabs.indexOf(from);
  openTabs.slice(i+1).forEach(k=>{const p=document.querySelector(`.tabpanel[data-k="${k}"]`);if(p)p.remove();delete scrollPos[k];});
  openTabs=openTabs.slice(0,i+1);
  if(!openTabs.includes(active))switchTab(from);else renderTabs();
}

/* context menu */
function showCtx(e,k){
  e.preventDefault();
  const i=openTabs.indexOf(k);
  const hasRight=i<openTabs.length-1;
  const hasOthers=openTabs.filter(x=>x!=='panel'&&x!==k).length>0;
  const dis=k==='panel';
  ctxmenu.innerHTML=`
    <div class="ci ${dis?'disabled':''}" onclick="hideCtx();closeTab('${k}')">✕ Cerrar</div>
    <div class="ci ${hasOthers?'':'disabled'}" onclick="hideCtx();closeOthers('${k}')">Cerrar las demás</div>
    <div class="ci ${hasRight?'':'disabled'}" onclick="hideCtx();closeRight('${k}')">Cerrar las de la derecha</div>
    <div class="sep"></div>
    <div class="ci" onclick="hideCtx();closeAll()">Cerrar todas</div>`;
  ctxmenu.style.left=Math.min(e.clientX,window.innerWidth-210)+'px';
  ctxmenu.style.top=e.clientY+'px';
  ctxmenu.classList.add('on');
}
function hideCtx(){ctxmenu.classList.remove('on');}
document.addEventListener('click',hideCtx);
document.addEventListener('scroll',hideCtx,true);

/* drag to reorder */
let dragK=null;
function wireDrag(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('dragstart',e=>{dragK=t.dataset.k;t.classList.add('dragging');});
    t.addEventListener('dragend',e=>{t.classList.remove('dragging');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('dragover'));});
    t.addEventListener('dragover',e=>{e.preventDefault();if(t.dataset.k!==dragK)t.classList.add('dragover');});
    t.addEventListener('dragleave',e=>t.classList.remove('dragover'));
    t.addEventListener('drop',e=>{
      e.preventDefault();t.classList.remove('dragover');
      const from=openTabs.indexOf(dragK), to=openTabs.indexOf(t.dataset.k);
      if(from<0||to<0||from===to)return;
      openTabs.splice(to,0,openTabs.splice(from,1)[0]);
      renderTabs();
    });
  });
}

function _resizeImg(file,cb){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const max=520;let w=img.width,h=img.height;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    try{cb(c.toDataURL('image/jpeg',0.82));}catch(err){cb(e.target.result);}
  };img.onerror=()=>cb(e.target.result);img.src=e.target.result;};
  r.readAsDataURL(file);
}

let CAJA=null, CIERRES=[];
function saveCaja(){if(CAJA&&!_applyingCaja)CAJA._ts=Date.now();try{localStorage.setItem('fenlora_caja',JSON.stringify(CAJA));}catch(e){} if(typeof pushCaja==='function'&&!_applyingCaja)pushCaja();}
function saveCierres(){try{localStorage.setItem('fenlora_cierres',JSON.stringify(CIERRES));}catch(e){}}

function cajaResumen(){
  if(!CAJA)return null;
  const fs=FACTURAS.filter(f=>f.ts>=CAJA.abiertaEn);
  const porMedio={};fs.forEach(f=>{const k=f.medioLabel||f.medio;porMedio[k]=(porMedio[k]||0)+f.total;});   // recibido por medio (incluye propina)
  const ventas=fs.reduce((s,f)=>s+(f.total-(f.propina||0)),0);   // ventas NETAS del negocio (sin propina)
  const efectivoVentas=fs.filter(f=>f.medio==='efectivo').reduce((s,f)=>s+f.total,0);   // efectivo físico recibido (incluye propina en efectivo)
  const propinas=fs.reduce((s,f)=>s+(f.propina||0),0);
  const ingresos=(CAJA.movimientos||[]).filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+m.monto,0);
  const egresos=(CAJA.movimientos||[]).filter(m=>m.tipo==='egreso').reduce((s,m)=>s+m.monto,0);
  const efectivoEsperado=CAJA.base+efectivoVentas+ingresos-egresos;
  return {fs,porMedio,ventas,efectivoVentas,propinas,ingresos,egresos,efectivoEsperado,nFacturas:fs.length};
}

function _fdate(ts){const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();}
function _isoDate(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function consolidadoSection(){
  if(!CIERRES.length)return '';
  const hoy=Date.now(), sem=hoy-6*86400000;
  return `<div class="section-title" style="margin-top:26px">📊 Consolidado para contabilidad</div>
    <div class="sub" style="margin:-4px 0 12px 0">Elige un rango (ej. la semana) para revisar el <b>cuadre de efectivo</b> de todos los turnos (esperado vs. contado, faltantes/sobrantes). El análisis de ventas está en Reportes.</div>
    <div class="consol-bar">
      <label>Desde <input type="date" class="pf-in" id="conDesde" value="${_isoDate(sem)}"></label>
      <label>Hasta <input type="date" class="pf-in" id="conHasta" value="${_isoDate(hoy)}"></label>
      <button class="btn ghost" style="width:auto;padding:9px 16px" onclick="verConsolidado()">Ver consolidado</button>
    </div>
    <div id="consolidadoOut"></div>`;
}
function csvRow(arr){return (arr||[]).map(v=>{v=(v==null?'':String(v));if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(';');}
function _download(name,content,mime){try{const blob=new Blob([content],{type:(mime||'text/csv')+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},120);}catch(e){toastT('Este navegador no permitió la descarga');}}
function cierreCSV(c){
  const medios=Object.keys(c.porMedio||{});const L=[];
  L.push(['Cierre de caja - Dulce Cafe']);
  L.push(['Cajero',c.cajero||'']);
  L.push(['Apertura',fhora(c.abiertaEn)]);
  L.push(['Cierre',fhora(c.cerradaEn)]);
  L.push([]);
  L.push(['Base inicial',c.base]);
  L.push(['Ventas del turno',c.ventasTotal]);
  medios.forEach(k=>L.push(['  '+k,c.porMedio[k]]));
  L.push(['Propinas',c.propinas]);
  L.push(['Ingresos manuales',c.ingresos]);
  L.push(['Egresos / gastos',c.egresos]);
  L.push(['Efectivo esperado',c.efectivoEsperado]);
  L.push(['Efectivo contado',c.efectivoContado]);
  L.push(['Diferencia',c.diferencia]);
  L.push(['Facturas',c.nFacturas]);
  if(c.movimientos&&c.movimientos.length){L.push([]);L.push(['Movimientos de caja']);L.push(['Tipo','Concepto','Monto','Fecha']);c.movimientos.forEach(m=>L.push([m.tipo,m.concepto,m.monto,fhora(m.ts)]));}
  return '\ufeff'+L.map(r=>csvRow(r)).join('\r\n');
}
function descargarCierreCSV(i){const c=CIERRES[i];if(!c)return;_download('cierre_'+_fdate(c.cerradaEn)+'.csv',cierreCSV(c));toastT('📥 Cierre descargado');}
function consolidadoCSV(list){
  const medios=[...new Set(list.flatMap(c=>Object.keys(c.porMedio||{})))];
  const head=['Apertura','Cierre','Cajero','Base','Ventas',...medios,'Propinas','Ingresos','Egresos','Efectivo esperado','Efectivo contado','Diferencia','Facturas'];
  const rows=[head];const sum=k=>list.reduce((s,c)=>s+(c[k]||0),0);
  list.forEach(c=>rows.push([fhora(c.abiertaEn),fhora(c.cerradaEn),c.cajero||'',c.base,c.ventasTotal,...medios.map(m=>(c.porMedio||{})[m]||0),c.propinas,c.ingresos,c.egresos,c.efectivoEsperado,c.efectivoContado,c.diferencia,c.nFacturas]));
  rows.push(['TOTALES','','',sum('base'),sum('ventasTotal'),...medios.map(m=>list.reduce((s,c)=>s+((c.porMedio||{})[m]||0),0)),sum('propinas'),sum('ingresos'),sum('egresos'),sum('efectivoEsperado'),sum('efectivoContado'),sum('diferencia'),sum('nFacturas')]);
  return '\ufeff'+rows.map(r=>csvRow(r)).join('\r\n');
}

function _repRange(){
  const de=document.getElementById('repDesde'),ha=document.getElementById('repHasta');
  const from=(de&&de.value)?new Date(de.value+'T00:00:00').getTime():0;
  const to=(ha&&ha.value)?new Date(ha.value+'T23:59:59').getTime():Date.now();
  return FACTURAS.filter(f=>f.ts>=from&&f.ts<=to);
}
function repData(list){
  const _neto=f=>f.total-(f.propina||0);   // venta neta (sin propina)
  const ventas=list.reduce((s,f)=>s+_neto(f),0);
  const propinas=list.reduce((s,f)=>s+(f.propina||0),0);
  const nItems=list.reduce((s,f)=>s+(f.nItems||0),0);
  const ticket=list.length?Math.round(ventas/list.length):0;
  const porDia={};list.forEach(f=>{const k=_isoDate(f.ts);porDia[k]=(porDia[k]||0)+_neto(f);});
  const prod={};list.forEach(f=>(f.items||[]).forEach(it=>{if(it.cort)return;if(!prod[it.n])prod[it.n]={qty:0,rev:0};prod[it.n].qty+=it.qty;prod[it.n].rev+=it.unit*it.qty;}));
  const topProd=Object.entries(prod).map(([n,v])=>({n,qty:v.qty,rev:v.rev})).sort((a,b)=>b.qty-a.qty);
  const medios={};list.forEach(f=>{const k=f.medioLabel||f.medio;medios[k]=(medios[k]||0)+f.total;});   // recibido por medio (incluye propina)
  const horas={};for(let h=0;h<24;h++)horas[h]=0;list.forEach(f=>{horas[new Date(f.ts).getHours()]+=_neto(f);});
  const origen={};list.forEach(f=>{const k=repClasifOrigen(f.origen);origen[k]=(origen[k]||0)+_neto(f);});
  const fe=list.filter(f=>f.dian).length;const pos=list.length-fe;
  return {ventas,propinas,nItems,ticket,n:list.length,porDia,topProd,medios,horas,origen,fe,pos};
}
function _bars(obj,fmt){
  const entries=Object.entries(obj);const max=Math.max(1,...entries.map(e=>e[1]));
  if(!entries.length)return '<div class="dash-empty">Sin datos.</div>';
  return `<div class="rep-bars">${entries.map(([k,v])=>`<div class="rep-brow"><div class="rep-lbl">${k}</div><div class="rep-track"><div class="rep-fill" style="width:${Math.max(2,Math.round(v/max*100))}%"></div></div><div class="rep-val">${fmt?fmt(v):COP(v)}</div></div>`).join('')}</div>`;
}
function repDataAnul(anul){
  const n=anul.length;
  const monto=anul.reduce((s,a)=>s+(a.monto||0),0);
  const porMotivo={},porProd={},porMesero={};
  anul.forEach(a=>{ const mo=((a.motivo||'').trim())||'(sin motivo)'; porMotivo[mo]=(porMotivo[mo]||0)+1; const pr=a.producto||'—'; porProd[pr]=(porProd[pr]||0)+1; const me=a.mesero||'—'; porMesero[me]=(porMesero[me]||0)+1; });
  return {n,monto,porMotivo,porProd,porMesero};
}

function loadSheetJS(cb){
  if(window.XLSX){cb();return;}
  const sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload=()=>cb();
  sc.onerror=()=>toastT('No se pudo cargar el lector de Excel. Prueba con CSV o revisa tu internet.');
  document.head.appendChild(sc);
}
function parseCSV(text){
  text=(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const first=text.split('\n')[0]||'';
  const delim=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let i=0,field='',row=[],inQ=false;
  while(i<text.length){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c;}
    else{if(c==='"')inQ=true;else if(c===delim){row.push(field);field='';}else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}else field+=c;}
    i++;}
  if(field.length||row.length){row.push(field);rows.push(row);}
  const headers=(rows.shift()||[]).map(h=>String(h).trim());
  return rows.filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={};headers.forEach((h,idx)=>o[h]=r[idx]!==undefined?r[idx]:'');return o;});
}
function impFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const name=(f.name||'').toLowerCase();
  if(name.endsWith('.csv')||f.type==='text/csv'){
    const r=new FileReader();r.onload=e=>{try{impPreview(parseCSV(e.target.result));}catch(err){toastT('No se pudo leer el CSV');}};r.readAsText(f,'UTF-8');
  }else{
    loadSheetJS(()=>{const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];impPreview(XLSX.utils.sheet_to_json(sh,{defval:''}));}catch(err){toastT('No se pudo leer el Excel');}};r.readAsArrayBuffer(f);});
  }
}
function _impNorm(rows){
  const nrm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const col=(row,...names)=>{for(const n of names){for(const k of Object.keys(row)){if(nrm(k)===nrm(n))return row[k];}}return '';};
  const hasCol=(row,...names)=>{for(const n of names){for(const k of Object.keys(row)){if(nrm(k)===nrm(n))return true;}}return false;};
  const boolv=(v,def)=>{v=(v||'').toString().trim();if(!v)return def;return /^(si|s|sí|yes|y|true|1|x)$/i.test(v);};
  return rows.map(r=>{
    const n=(col(r,'nombre','producto','name')||'').toString().trim();
    const pr=parseInt((col(r,'precio','valor','price')||'').toString().replace(/[^\d]/g,''))||0;
    return {n,pr,cat:((col(r,'categoria','cat')||'Otros').toString().trim())||'Otros',area:((col(r,'area')||'COCINA').toString().trim().toUpperCase())||'COCINA',e:((col(r,'emoji','icono')||'🍽️').toString().trim())||'🍽️',desc:(col(r,'descripcion')||'').toString().trim(),activo:boolv(col(r,'disponible','activo'),true),enPanel:true,enQR:boolv(col(r,'menu qr','qr','menuqr'),true),rec:boolv(col(r,'recomendado','destacado'),false),
      _hasActivo:hasCol(r,'disponible','activo'),_hasQR:hasCol(r,'menu qr','qr','menuqr'),_hasRec:hasCol(r,'recomendado','destacado'),_hasDesc:hasCol(r,'descripcion'),_hasEmoji:hasCol(r,'emoji','icono'),_hasCat:hasCol(r,'categoria','cat'),_hasArea:hasCol(r,'area'),
      _valid:!!(n&&pr>0)};
  });
}
function _prodNameKey(n){return (n||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function _findProdByName(n){const k=_prodNameKey(n);return PRODUCTS.find(p=>_prodNameKey(p.n)===k);}
function impPreview(rows){
  const prods=_impNorm(rows);window._impProducts=prods;
  const el=document.getElementById('impPreview');if(!el)return;
  if(!prods.length){el.innerHTML='<div class="dash-empty">El archivo no tiene filas de datos. Revisa que tenga encabezados y al menos una fila.</div>';return;}
  const valid=prods.filter(p=>p._valid),invalid=prods.length-valid.length;
  const actualiza=valid.filter(p=>_findProdByName(p.n)).length, nuevos=valid.length-actualiza;
  el.innerHTML=`
    <div class="imp-summary">Detectados <b>${prods.length}</b> · <b style="color:var(--primary)">${nuevos}</b> nuevos · <b style="color:var(--blue)">${actualiza}</b> se actualizan${invalid?` · <b style="color:var(--red)">${invalid}</b> sin nombre o precio (se omiten)`:''}</div>
    <div class="imp-table"><div class="imp-th"><span>Producto</span><span>Precio</span><span>Categoría</span><span>Área</span></div>
    ${prods.slice(0,60).map(p=>`<div class="imp-tr ${p._valid?'':'bad'}"><span>${p.n||'&lt;sin nombre&gt;'}</span><span>${p.pr?COP(p.pr):'—'}</span><span>${p.cat}</span><span>${p.area}</span></div>`).join('')}
    ${prods.length>60?`<div class="imp-more">…y ${prods.length-60} más</div>`:''}</div>
    <div class="imp-mode">
      <label><input type="radio" name="impMode" value="add" checked> Agregar y actualizar (si el nombre ya existe, actualiza sin duplicar y conserva su foto/opciones)</label>
      <label><input type="radio" name="impMode" value="replace"> Reemplazar todo el catálogo</label>
    </div>
    <button class="btn primary" style="width:100%;margin-top:8px" ${valid.length?'':'disabled'} onclick="impConfirm()">${nuevos+actualiza?`Importar (${nuevos} nuevos, ${actualiza} actualizar)`:'Importar'}</button>`;
}
function impConfirm(){
  const prods=(window._impProducts||[]).filter(p=>p._valid);if(!prods.length)return;
  const mode=(document.querySelector('input[name=impMode]:checked')||{}).value||'add';
  if(mode==='replace'&&!confirm('Esto reemplazará TODO el catálogo actual (incluidas fotos y opciones). ¿Continuar?'))return;
  if(mode==='replace')PRODUCTS.length=0;
  let nuevos=0,act=0;
  prods.forEach(p=>{
    const ex=(mode==='add')?_findProdByName(p.n):null;

    if(ex){ ex.n=p.n;ex.pr=p.pr; if(p._hasCat)ex.cat=p.cat; if(p._hasArea)ex.area=p.area; if(p._hasEmoji)ex.e=p.e; if(p._hasDesc)ex.desc=p.desc; if(p._hasActivo)ex.activo=p.activo; if(p._hasQR)ex.enQR=p.enQR; if(p._hasRec)ex.rec=p.rec; act++; }
    else { PRODUCTS.push({id:'p'+(productSeq++),n:p.n,pr:p.pr,cat:p.cat,area:p.area,e:p.e,desc:p.desc,activo:p.activo,enPanel:p.enPanel,enQR:p.enQR,rec:p.rec}); nuevos++; }
  });

  Object.keys(ORD).forEach(k=>{if(document.getElementById('prods_'+k))renderProds(k);});
  toastT(`✅ ${nuevos} nuevo(s)${act?` · ${act} actualizado(s)`:''}`);
}

function mesaKitchen(m){
  const key=m.grp||('mesa_'+m.n);const lines=ORD[key];
  if(!lines||!lines.length) return m.ped||null;
  const unsent=lines.filter(l=>!l.sent&&!l.held&&!l.served);
  const inKitchen=lines.filter(l=>l.sent&&!l.served&&!l.ready);
  const ready=lines.filter(l=>l.sent&&!l.served&&l.ready);
  if(unsent.length && (inKitchen.length||ready.length)) return 'parcial';
  if(unsent.length) return 'sinpedir';
  if(inKitchen.length) return 'cocina';
  if(ready.length) return 'listo';
  if(lines.every(l=>l.served||l.held)) return 'servido';
  return m.ped||null;
}
